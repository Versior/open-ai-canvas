  /skills/{id}/files:
    parameters:
      - {
          in: path,
          name: id,
          required: true,
          description: 技能 ID,
          schema: { type: string },
        }
    put:
      tags: [skills]
      summary: 作者批量写入、重命名或删除技能包文本文件，并生成新的技能版本
      description: 按顺序应用 operations 后重建 ZIP 与文件清单；SKILL.md 变化时同步 instruction。baseVersionId 必须等于当前版本，否则返回 409 skill_version_conflict，details.currentVersionId 为最新版本。GitHub 技能返回 409 failed_precondition。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersionId, operations]
              properties:
                baseVersionId:
                  { type: string, description: 编辑开始时读取到的 versionId }
                operations:
                  type: array
                  minItems: 1
                  maxItems: 256
                  items:
                    type: object
                    required: [op, path]
                    properties:
                      op: { type: string, enum: [write, rename, delete] }
                      path:
                        {
                          type: string,
                          description: 规范化相对路径，最多 8 层，不允许 .. / 绝对路径 / .git / 控制字符,
                        }
                      to: { type: string, description: rename 的目标路径 }
                      content:
                        {
                          type: string,
                          description: write 的 UTF-8 文本，单文件不超过 512KB,
                        }
      responses:
        "200":
          {
            description: 标准信封 data 为 skill、files 与 changed；内容未变化时 changed=false 且不生成版本,
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
