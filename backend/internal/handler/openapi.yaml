openapi: 3.0.3
info:
  title: 影策 HTTP API
  version: "1.0.0"
  description: |
    路径前缀是 `/api`。前后端一起发布，不按路径做 API 版本。

    业务 JSON 信封为 `{ code, data, msg, reason }`。`code === 0` 表示成功；失败时 HTTP status 与
    `code` 都表达失败。`code` 默认等于 HTTP 状态；同一状态下的细分原因使用 `status*100+n`
    （例如 40301 配额、42901 限流）。机器判断请用 `reason`，不要解析 `msg`。

    TypeScript 调用面仍是 `web/src/services/api` 的 `http` 模块，不从本规范生成客户端。
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: meta
  - name: auth
  - name: projects
  - name: canvas
  - name: resources
  - name: tasks
  - name: assets
  - name: models
  - name: agent
  - name: admin
  - name: skills
  - name: workbench
  - name: feedback
    description: 用户反馈与管理员收件箱
  - name: guest
    description: 游客只读展示接口：功能开关、模型目录与 LibTV 公开作品
  - name: referral
    description: 推广中心：推广码、邀请记录与返佣
  - name: inspirations
    description: 灵感大厅上新（定时同步的上游中文提示词）
  - name: pose-library
    description: 站点姿势库：浏览、选用，管理员导入与图片同步
paths:
  /canvas-projects:
    get:
      tags: [canvas]
      summary: 分页读取自己的画布
      description: 旧版电商画布已下线，带 kind=ecommerce 的存量画布与自由画布在同一列表中返回。
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 50}}
      responses:
        "200": {description: 分页信封 data 包含 projects、total、hasMore；每项包含受限预览}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /admin/settings/ecommerce/defaults:
    get:
      tags: [admin]
      summary: 管理员读取内置默认指令全文
      description: data.defaults 按能力标识及四种用途返回 worker 实际使用的内置规则。只读，不修改覆盖或 revision；普通用户无权读取。
      responses:
        "200": {description: data.defaults 为字符串映射；Cache-Control 为 no-store}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /ecommerce/templates:
    get:
      tags: [canvas]
      summary: 搜索分页读取项目内置套图库
      description: 登录可读，普通用户须开放「电商生图台」；管理员不受开关限制。返回摘要，逐套读取完整提示词，避免向配置接口装载全库。category 只取这个一级类目；categories 按搜索词统计每个一级类目的套数（不受 category 影响），数量多的在前。
      parameters:
        - {in: query, name: q, schema: {type: string, maxLength: 100}}
        - {in: query, name: category, description: 一级类目名，空为全部, schema: {type: string, maxLength: 50}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        "200": {description: data 包含 items、total、categories、page、pageSize；每项含 id、name、category、description、count；categories 每项含 name、count}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /ecommerce/templates/{templateId}:
    get:
      tags: [canvas]
      summary: 读取单套内置模板的完整视觉规范与画面参考
      description: 权限同套图库。data.template 可作为分析参考或载入后台草稿，原内置内容只读。
      parameters:
        - {in: path, name: templateId, required: true, schema: {type: string}}
      responses:
        "200": {description: data.template 为 EcommerceSuiteTemplate}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /ecommerce/studio/templates:
    get:
      tags: [canvas]
      summary: 读取后台已启用的套图模板
      description: 权限同套图库。只返回 enabled 为 true 的模板，供生图台「模板套图」选择；停用草稿不返回。
      responses:
        "200": {description: data.templates 为 EcommerceSuiteTemplate 数组}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /ecommerce/studio/prompts:
    get:
      tags: [canvas]
      summary: 读取后台改过的生图台出图提示词
      description: 权限同套图库。data.prompts 是提示词编号到文字的映射，只含后台改过的条目；生图台出图时用它替换内置写法。
      responses:
        "200": {description: data.prompts 为对象，值为字符串}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /ecommerce/studio/models:
    get:
      tags: [canvas]
      summary: 浏览电商模特库
      description: 登录可读，普通用户须开放「电商生图台」，只返回已上架的素材；管理员不受开关限制。kind 为 face 模特人脸、figure 全身模特、pose 姿势、style 模特样式。
      parameters:
        - {in: query, name: kind, required: true, schema: {type: string, enum: [face, figure, pose, style]}}
        - {in: query, name: q, schema: {type: string, maxLength: 60}}
        - {in: query, name: category, schema: {type: string}}
        - {in: query, name: gender, schema: {type: string, enum: ["", female, male]}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 60, default: 24}}
      responses:
        "200": {description: data 包含 items、total、page、pageSize、categories；每项含 id、kind、name、category、gender、tags、prompt、hasImage、width、height、revision}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /ecommerce/studio/models/{id}/image:
    get:
      tags: [canvas]
      summary: 读取模特库素材图
      description: 权限同浏览；未上架的素材只有管理员能看。variant=thumb 给不超过 512 像素的缩略图；带 v=revision 时可缓存一天。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: variant, schema: {type: string, enum: [thumb]}}
        - {in: query, name: v, schema: {type: string}}
      responses:
        "200": {description: 图片二进制}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /ecommerce/studio/models/{id}/attach:
    post:
      tags: [canvas]
      summary: 选用模特库素材
      description: 把素材原图复制到当前用户的资源库并返回 data.resourceId，出图任务引用用户自己的资源。同一用户对同一张原图只复制一次，计入上传配额；按上传频率限流。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200": {description: data 包含 resourceId、width、height}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /admin/studio-models:
    get:
      tags: [admin]
      summary: 管理员列出模特库素材
      description: 包括未上架的素材；可按分类和上下架筛选（无 gender）。
      parameters:
        - {in: query, name: kind, required: true, schema: {type: string, enum: [face, figure, pose, style]}}
        - {in: query, name: q, schema: {type: string, maxLength: 60}}
        - {in: query, name: category, schema: {type: string, maxLength: 24}}
        - {in: query, name: status, description: 空为全部, schema: {type: string, enum: [enabled, disabled]}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 60, default: 24}}
      responses:
        "200": {description: 结构同浏览接口，素材另含 enabled、consent、sortOrder、updatedAt；data 另含 kindCounts（face、figure、pose、style 各自总条数）与 categoryCounts（当前类型各分类的 name、count，条数多的在前，不含未分类）}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/studio-models/import:
    post:
      tags: [admin]
      summary: 管理员新增模特库素材
      description: multipart 表单：kind、name、category、gender、tags（JSON 数组或逗号分隔）、prompt、consent、enabled 与可选 file（PNG/JPEG/WebP，12 MiB、4000 万像素以内）。人脸、全身模特和姿势必须带图，人脸和全身模特须确认肖像授权才能上架，模特样式必须写造型描述。原图与缩略图存为本地 studio-model 资源，不计入个人容量。
      responses:
        "200": {description: data.item 为新素材}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/studio-models/{id}:
    put:
      tags: [admin]
      summary: 管理员修改模特库素材
      description: 只改文字字段、授权确认与上下架；类型和图片不能改。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200": {description: data.item 为修改后的素材}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [admin]
      summary: 管理员删除模特库素材
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200": {description: data.affected 为删除条数}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /admin/studio-models/batch:
    post:
      tags: [admin]
      summary: 管理员批量上架、下架或删除模特库素材
      description: 请求体 {"ids":[...],"action":"enable|disable|delete"}，一次 1–200 条。上架时有人脸或全身模特没确认肖像授权则整批不执行。
      responses:
        "200": {description: data.affected 为影响条数}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /admin/studio-models/remote-import:
    get:
      tags: [admin]
      summary: 管理员查看模特库远程拉取进度
      description: 返回最近一次拉取的进度与可以一键拉取的内置来源。进度只存在本进程内存里，后端重启后回到 idle。
      responses:
        "200": {description: data 包含 status（idle、running、done、failed、cancelled）、source（来源名称或去掉查询串的清单地址）、startedAt、finishedAt、error、report（total、done、imported、skipped、failed、failures，failures 只留前 50 条）与 sources（每项 id、name、description、notice）}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      tags: [admin]
      summary: 管理员开始远程拉取模特库
      description: 请求体 {"source":"ai-pose-gallery-zh"} 或 {"manifestUrl":"https://…"}，二选一，可带 faceConsentAttested。服务端在后台下载清单与图片，逐条走与后台新增相同的校验、缩略图和存储，按类型 + 分类 + 名称跳过已有的；faceConsentAttested 为假时人脸和全身模特不标授权、不上架。清单地址按出站规则拒绝本机、内网和链路本地地址。一次只跑一个。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source: {type: string, enum: [ai-pose-gallery-zh]}
                manifestUrl: {type: string, maxLength: 2048}
                faceConsentAttested: {type: boolean}
      responses:
        "200": {description: data 结构同 GET，status 为 running}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
    delete:
      tags: [admin]
      summary: 管理员停止模特库远程拉取
      description: 停止正在进行的拉取，已经导入的保留，再拉会跳过它们。没有在跑时原样返回进度。
      responses:
        "200": {description: data 结构同 GET}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/settings/ecommerce:
    get:
      tags: [admin]
      summary: 管理员读取完整电商生图台配置
      description: 后台页面只编辑商品档案能力与套图模板；旧版电商画布的字段（总开关、其他能力、公共模特）仍随配置保存，保存时原样提交。
      responses:
        "200": {description: 标准信封 data.setting 为 EcommerceSetting}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    put:
      tags: [admin]
      summary: 保存配置并保留上一版
      description: 需要管理员，携带读取时 revision，过期版本拒绝覆盖。当前配置、上一版和审计在同一事务提交。新增图片须属于当前管理员；已有及上一版引用允许其他管理员维护。请求体上限 2 MiB。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EcommerceSetting"}
      responses:
        "200": {description: 标准信封 data.setting 为新 revision 的完整配置}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/settings/ecommerce/previous:
    get:
      tags: [admin]
      summary: 管理员读取上一版供草稿恢复
      description: 只读取不激活，保存时须使用当前配置 revision。
      responses:
        "200": {description: 标准信封 data.setting 为上一版 EcommerceSetting}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /ecommerce/studio:
    get:
      tags: [canvas]
      summary: 读取当前用户的电商生图台工作区
      description: 登录可读，只返回本人的商品档案、出图方案与采用结果。revision 为整份工作区的修订号，每次保存或删除加一。Cache-Control 为 no-store。
      responses:
        "200": {description: data 包含 revision 与 products；products 为前端定义的商品对象数组}
        "401": {$ref: "#/components/responses/Error"}
  /ecommerce/studio/products/{productId}:
    get:
      tags: [canvas]
      summary: 读取一个生图台商品
      description: 只返回本人的商品；保存冲突后用它载入最新版本。Cache-Control 为 no-store。
      parameters:
        - {in: path, name: productId, required: true, schema: {type: string, minLength: 6, maxLength: 80}}
      responses:
        "200": {description: data 包含工作区 revision 与 product；product.revision 是该商品的修订号}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [canvas]
      summary: 新建或整体替换一个生图台商品
      description: 请求体只能是 {product, expectedRevision}，product.id 必须与地址一致（6–80 位字母、数字、下划线或连字符）。expectedRevision 是上次读到的商品修订号（新商品为 0），与服务端不一致时返回 409、reason=studio_product_conflict、details.revision 为当前值；省略时直接覆盖。product.revision 由服务端写入，客户端传来的值被忽略。单个商品不超过 1 MiB、整份工作区不超过 8 MiB、最多 200 个商品；不能内嵌 data URL，图片须先上传为资源，并以 resourceId 字段引用，孤儿清理会据此保留这些资源。与旧私有库共用一行数据，其他键原样保留。受画布写入频率限制。
      parameters:
        - {in: path, name: productId, required: true, schema: {type: string, minLength: 6, maxLength: 80}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product]
              additionalProperties: false
              properties:
                product: {type: object}
                expectedRevision: {type: integer, minimum: 0}
      responses:
        "200": {description: data 包含新的工作区 revision 与规范化后的 product（带新的 product.revision）}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    delete:
      tags: [canvas]
      summary: 删除一个生图台商品
      description: 幂等，商品不存在时同样返回当前 revision。只删除工作区记录，不删除已上传的素材与任务。
      parameters:
        - {in: path, name: productId, required: true, schema: {type: string, minLength: 6, maxLength: 80}}
      responses:
        "200": {description: data.revision 为删除后的修订号}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /ecommerce/product-videos:
    get:
      tags: [canvas]
      summary: 视频复刻 · 元素替换的作品列表
      description: 需要登录并打开「视频复刻」开关。只返回本人的作品；作品对象由前端定义（素材、参考视频片段、每段生成任务、成片）。revision 是电商私有数据整行的修订号。Cache-Control 为 no-store。
      responses:
        "200": {description: data 包含 revision 与 items；items 为作品对象数组，每条带服务端维护的 revision}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /ecommerce/product-videos/{videoId}:
    get:
      tags: [canvas]
      summary: 读取一条元素替换作品
      description: 只返回本人的作品；保存冲突后用它载入最新版本。Cache-Control 为 no-store。
      parameters:
        - {in: path, name: videoId, required: true, schema: {type: string, minLength: 6, maxLength: 80}}
      responses:
        "200": {description: data 包含整行 revision 与 item；item.revision 是该作品的修订号}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [canvas]
      summary: 新建或整体替换一条元素替换作品
      description: 请求体只能是 {item, expectedRevision}，item.id 必须与地址一致。expectedRevision 必填，是上次读到的作品修订号（新作品为 0），不一致时返回 409、reason=product_video_conflict、details.revision 为当前值。item.revision 由服务端写入。单条不超过 128 KiB、最多 100 条，和生图台共用的电商私有数据整行不超过 8 MiB；不能内嵌 data URL，素材和成片以 resourceId / keyframeResourceId 字段引用，孤儿清理会据此保留这些资源。与生图台共用一行数据，其他键原样保留。受画布写入频率限制。
      parameters:
        - {in: path, name: videoId, required: true, schema: {type: string, minLength: 6, maxLength: 80}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item, expectedRevision]
              additionalProperties: false
              properties:
                item: {type: object}
                expectedRevision: {type: integer, minimum: 0}
      responses:
        "200": {description: data 包含新的整行 revision 与规范化后的 item（带新的 item.revision）}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
    delete:
      tags: [canvas]
      summary: 删除一条元素替换作品
      description: 幂等，作品不存在时同样成功。只删除作品记录，不删除已上传的素材、参考片段、生成任务与成片资源。
      parameters:
        - {in: path, name: videoId, required: true, schema: {type: string, minLength: 6, maxLength: 80}}
      responses:
        "200": {description: data.revision 为删除后的整行修订号}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /ecommerce/product-videos/splits:
    post:
      tags: [tasks]
      summary: 视频复刻 · 元素替换：把参考视频按镜头切成一次生成能参考的片段
      description: 需要登录并打开「视频复刻」开关。异步任务（type=product_video_split），服务端用本地 ffmpeg 在选段内检测镜头切点，尽量在切点处断开，每段不超过 maxSegmentSeconds（8–30 秒，默认 15）、不短于 4 秒；单个镜头超长时均分。每段重新编码为短边不超过 720、30fps 的 H.264/AAC mp4，并截一帧封面，都作为本人的资源保存。结果写入任务 resultJson：source（原视频尺寸、时长、有无音轨）、startMs/endMs、segments[{index, startMs, endMs, durationMs, boundary, resourceId, width, height, keyframeResourceId}]、warnings。选段须在 4–120 秒之间。不调用模型、不计费。相同用户使用相同幂等键和请求参数时返回原任务，参数不同返回 409。
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema: {type: string, minLength: 8, maxLength: 128}
          description: 客户端为一次切段生成的稳定幂等键；重试原请求时必须复用
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceId]
              properties:
                resourceId: {type: string, description: 本人已就绪的视频资源}
                startMs: {type: integer, minimum: 0, description: 选段开头，默认 0}
                endMs: {type: integer, minimum: 0, description: 选段结尾，0 表示到视频结尾}
                maxSegmentSeconds: {type: integer, minimum: 8, maximum: 30, description: 每段时长上限，按所选模型的参考视频时长传入；0 表示 15 秒}
                ranges:
                  type: array
                  maxItems: 60
                  description: 复刻工作台用。给了就按这些范围原样切，不检测镜头、忽略 startMs/endMs；每段 1 秒到 maxSegmentSeconds，范围可以重叠，segments 按给定顺序返回；结尾比视频略长时截到结尾，超出太多时任务失败
                  items:
                    type: object
                    required: [startMs, endMs]
                    properties:
                      startMs: {type: integer, minimum: 0}
                      endMs: {type: integer, minimum: 0}
      responses:
        "200": {description: 已创建或复用异步切段任务，data 为任务}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /timeline/jianying-draft:
    post:
      tags: [tasks]
      summary: 把一份时间线快照导出成剪映草稿 ZIP
      description: 需要登录。表单提交（application/x-www-form-urlencoded），正文不超过 512 KiB。timeline 与 POST /timeline/renders 的 timeline 同结构（v2 tracks/clips，片段用 directMedia.storageKey=resource:<id> 引用本人就绪的资源，最多 600 个片段）。video 片段按 startMs/sourceStartMs 放在主轨，静音轨上的片段音量为 0；audio 片段按 trackId 分到音频轨（loop=true 时按素材时长切成几段），可以引用音频文件或视频文件里的声音；subtitle 片段的 text 进字幕轨并附 SRT；overlay 图片片段不导出。任何素材不可用时返回 400，不导出缺素材的草稿。成功时直接返回 application/zip 附件，压缩包里是草稿文件夹（draft_content.json、draft_info.json、draft_meta_info.json、materials/、导入说明.txt）。超容量只读时仍可导出。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [draftRoot, timeline]
              properties:
                draftRoot: {type: string, description: 用户本机剪映草稿目录的绝对路径，素材路径按它写入草稿}
                name: {type: string, description: 草稿名，会加上导出时间}
                timeline: {type: string, description: 时间线快照 JSON 字符串}
      responses:
        "200": {description: 剪映草稿 ZIP 附件}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
