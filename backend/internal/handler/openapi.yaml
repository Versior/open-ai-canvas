      description: 商店、换形象菜单和后台列表先显示缩略图，悬停或选中时才加载整张图集。读取权限与图集相同。v 等于 revision 时长期缓存；待机状态改用其他动作时 v 为 revision 加 “.动作名”。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: v, schema: {type: string}}
      responses:
        "200": {description: PNG 缩略图}
        "304": {description: 未变化}
