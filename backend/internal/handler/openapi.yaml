        "200": { $ref: "#/components/responses/Envelope" }
  /projects/{id}/assets/{assetId}/image:
    put:
      tags: [projects, assets]
      summary: 为场景或道具绑定图片并创建新版本
      description: 校验项目归属、资产关联、版本归属与就绪图片资源；过期版本拒绝。旧版本与图片引用保留。
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: assetId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceId, expectedVersionId]
              properties:
                resourceId: { type: string, minLength: 1 }
                expectedVersionId: { type: string, minLength: 1 }
      responses:
        "200":
          description: 成功信封 data={asset}，包含 visual.definition/status 和新版本、图片资源定位
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/login-logs:
    get:
      tags: [admin]
      summary: 管理员分页查询用户登录登出日志
      description: 按时间倒序，保留用户快照；失败账号脱敏，无密码、验证码或会话凭据。
      parameters:
        - {
            in: query,
            name: keyword,
            schema: { type: string, maxLength: 160 },
            description: 用户名、昵称、脱敏账号或用户 ID,
          }
        - {
            in: query,
            name: event,
            schema: { type: string, enum: [login, logout] },
          }
        - {
            in: query,
            name: method,
            schema:
              {
                type: string,
                enum: [password, email, sms, linuxdo, verification, unknown],
              },
          }
        - {
            in: query,
            name: result,
            schema: { type: string, enum: [success, failed] },
          }
        - {
            in: query,
            name: ip,
            schema: { type: string },
            description: 精确匹配 IPv4 或 IPv6,
          }
        - {
            in: query,
            name: from,
            schema: { type: string, format: date-time },
            description: 包含开始时刻，RFC3339,
          }
        - {
            in: query,
            name: to,
            schema: { type: string, format: date-time },
            description: 包含结束时刻，RFC3339,
          }
        - {
            in: query,
            name: page,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, default: 20 },
          }
      responses:
        "200":
          description: 成功信封 data={logs,total,page,pageSize}
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, enum: [0] }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      logs:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/LoginLog" },
                        }
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/login-logs/{id}:
    get:
      tags: [admin]
      summary: 管理员读取单条登录日志详情
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: 成功信封 data.log
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, enum: [0] }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      log: { $ref: "#/components/schemas/LoginLog" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /feedbacks:
    post:
      tags: [feedback]
      summary: 提交用户反馈
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackSubmission" }
