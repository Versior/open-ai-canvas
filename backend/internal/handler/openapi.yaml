          name: projectId
          schema:
            type: string
        - in: query
          name: canvasId
          schema:
            type: string
      responses:
        "200":
          description: 信封 data 为合并 revision、hash 和按 user/project/canvas 顺序排列的 layers；每层含独立数字 revision
        "403":
          description: 项目或画布不属于当前用户
    patch:
      tags: [agent]
      summary: 使用单层 revision CAS 更新 Agent 偏好
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProfileRequest"
      responses:
        "200":
          description: 返回更新后的生效偏好视图
        "409":
          description: 偏好 revision 已变化，须重新读取后保存
  /agent/memory:
    get:
      tags: [agent]
      summary: 读取当前用户的 Agent 记忆文件
      responses:
        "200":
          {
            description: "标准信封 data 为 {mode, capacity, charCount, revision, entries, pendingCount, updatedAt}；entries 每条含 id、section（user|notes）、text",
          }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [agent]
      summary: 用户整体保存记忆文件（按 revision CAS）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, entries]
              properties:
                revision:
                  {
                    type: integer,
                    format: int64,
                    description: 读取时的 revision；不一致返回 409,
                  }
                entries:
                  type: array
                  maxItems: 80
                  items:
                    type: object
                    required: [section, text]
                    properties:
                      id:
                        { type: string, description: 保留原条目 ID；新条目留空 }
                      section: { type: string, enum: [user, notes] }
                      text: { type: string, description: 单条最多 400 字 }
      responses:
        "200":
          {
            description: 返回保存后的记忆文件；总量不得超过 capacity（5000 字），疑似密钥或敏感内容返回 400,
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { description: 记忆文件已被 Agent 或其他页面修改，须重新读取 }
  /agent/memory/settings:
    patch:
      tags: [agent]
      summary: 设置记忆模式
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  {
                    type: string,
                    enum: [auto, review, off],
                    description: auto 直接写入并可撤销；review 先暂存待确认；off 不注入也不提供写入工具,
                  }
      responses:
        "200": { description: 返回更新后的记忆文件 }
