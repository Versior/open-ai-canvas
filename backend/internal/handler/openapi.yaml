      responses:
        "200": { description: data 含 task、pages、posterCanvas }
        "404": { $ref: "#/components/responses/Error" }
  /agent/generate:
    post:
      tags: [ecommerce-agent]
      summary: 同步生成整套商品图片与可编辑画布
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/EcommerceAgentRequest" },
                },
            },
        }
      responses:
        "200": { description: data 含 task、pages、posterCanvas }
        "402": { $ref: "#/components/responses/Error" }
  /agent/generate/stream:
    post:
      tags: [ecommerce-agent]
