                model: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/compact:
    post:
      tags: [agent]
      summary: 生成一次待审批的个人记忆压缩提案（走用户文本模型计费）
      description: 每批最多80条、输入最多48KiB，按稳定ID公平轮转。模型回调只保存提案，不修改已批准记忆；需由本人带version批准才应用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                logicalModelId: { type: string }
                channelId: { type: string }
                channelModelKey: { type: string }
                model: { type: string }
      responses:
        "200":
          description: 信封 data 为含 taskId/proposalId 的压缩设置视图；通常为 queued，快速完成时可已进入 awaiting_review
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        { $ref: "#/components/schemas/AgentMemoryCompactView" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/proposals:
    get:
      tags: [agent]
      summary: 列出当前用户的记忆压缩提案
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: 按创建时间倒序的用户私有压缩提案
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [proposals]
                        properties:
                          proposals:
                            type: array
                            items:
                              {
                                $ref: "#/components/schemas/AgentMemoryProposal",
                              }
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/proposals/{proposalId}/decide:
    parameters:
      - in: path
        name: proposalId
        required: true
        schema: { type: string }
    post:
      tags: [agent]
      summary: 按版本批准或拒绝当前用户的压缩提案
      description: 批准前锁定全部源记忆并比较输入快照，任一内容或状态变化时整批409且不留下部分修改。批准保留完整恢复版本；拒绝不改变记忆。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMemoryProposalDecision" }
      responses:
        "200":
          description: 操作成功后的压缩提案视图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AgentMemoryProposal" }
        "400":
          description: 缺少或无效version、决定无效或请求包含未知字段
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: 对象不存在或不属于当前用户
        "409":
          description: version或记忆内容前置条件不匹配；整批未执行
  /agent/memories/revisions:
    get:
      tags: [agent]
      summary: 列出当前用户的记忆可恢复版本
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: 按创建时间倒序的用户私有可恢复版本
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [revisions]
                        properties:
                          revisions:
                            type: array
                            items:
                              {
                                $ref: "#/components/schemas/AgentMemoryRevision",
                              }
        "401":
          $ref: "#/components/responses/Error"
  /agent/memories/revisions/{revisionId}/restore:
    parameters:
      - in: path
        name: revisionId
        required: true
        schema: { type: string }
    post:
      tags: [agent]
      summary: 按版本恢复一次已应用压缩前的记忆
      description: 要求全部保留条目仍匹配应用后快照，且被删除ID未被复用；有后续编辑、删除或ID复用时整批409。不能覆盖他人记录，同一版本只成功恢复一次。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMemoryRevisionRestore" }
      responses:
        "200":
          description: 操作成功后的可恢复版本视图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AgentMemoryRevision" }
        "400":
          description: 缺少或无效version、决定无效或请求包含未知字段
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: 对象不存在或不属于当前用户
        "409":
          description: version或记忆内容前置条件不匹配；整批未执行
  /agent/memories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [agent]
      summary: 更新一条属于当前用户的记忆
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [agent]
      summary: 删除一条属于当前用户的记忆
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /agent/memories/{id}/decide:
    post:
      tags: [agent]
      summary: 批准或拒绝一条属于当前用户的待审记忆
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /agent/conversations:
    get:
      tags: [agent]
      summary: 读取当前用户在画布中参与的 Agent 对话
      description: 只读目录，不创建运行或调用模型。按最新轮 createdAt、id 倒序；即使对话后来换绑画布，latestRunId、status、revision、cleanupPending 仍来自该对话全局最新一轮。仅返回当前登录用户的记录，画布必须属于当前用户。
      parameters:
        - in: query
          name: canvasId
          required: true
          schema: { type: string, maxLength: 80 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: before
          description: 上一页返回的不透明 nextCursor
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: 信封 data 为 items（id、canvasId、title、latestRunId、status、revision、cleanupPending、createdAt、updatedAt）和可选 nextCursor；没有记录时 items 为空数组
        "400":
          description: 画布 ID、limit 或分页游标无效
        "404":
          description: 画布不存在或不属于当前用户
  /agent/conversations/{id}:
    get:
      tags: [agent]
      summary: 读取单个 Agent 对话的最新轮次摘要
      description: 只读控制列，不载入事件。用于判断当前画布目录之外的已选对话是否变化；字段与目录项相同，latestRunId、status、revision、cleanupPending 来自该对话全局最新一轮。仅返回当前登录用户的记录。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: 信封 data 为单个目录项（id、canvasId、title、latestRunId、status、revision、cleanupPending、createdAt、updatedAt）
        "400":
          description: 会话 ID 无效
        "404":
          description: 会话不存在或不属于当前用户
  /agent/conversations/{id}/runs:
    get:
      tags: [agent]
      summary: 按时间顺序恢复当前用户的完整 Agent 对话轮次
      description: 仅返回当前用户、同一 conversationId 的不可变轮次，包含跨页面换绑画布后的轮次。按 createdAt、id 升序分页；每轮默认带尾部事件窗口，完整事件使用运行详情 fromStart 和 sinceSeq 分页读取。读取不恢复执行或重复调用工具。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, maxLength: 80 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: after
          description: 上一页返回的不透明 nextCursor
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: 信封 data 为 items（与 data.run 相同的运行视图，含 conversationId、userPrompt、idempotencyKey）和可选 nextCursor
        "400":
          description: 会话 ID、limit 或分页游标无效
        "404":
          description: 会话不存在或不属于当前用户
  /agent/runs:
    post:
      tags: [agent]
      summary: 创建一轮云端 Agent 任务
      description: 同一画布同时只允许一轮执行。排队、运行、等待审批及终态收尾均占用；服务端在创建任务和预留积分前以事务串行校验。浏览器断开不释放占用，同一轮幂等恢复不受影响。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudAgentRequest"
      responses:
        "200":
          description: 信封 data.run，包含新一轮 id、conversationId、userPrompt、idempotencyKey、canvasId、status、permissionMode、model 及时间
        "400":
          description: 参数、能力、模型或预算不符合要求，未创建任务
        "409":
          description: 幂等键已用于不同请求，或画布已有另一轮 Agent 占用。占用拒绝的 reason 为 canvas_agent_busy，details 包含 canvasId 和 agent（runId、status、cleanupPending），用于立即更新占用状态；未创建任务或预留积分，不自动重试。
  /agent/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    get:
      tags: [agent]
      summary: 读取当前用户的 Agent 轮次
      description: data.run 只返回一页事件（默认最新 40 条）并带上 eventSeqBase、eventCount、latestSeq、eventsTruncated：eventSeqBase 是本次首条事件之前已入库的条数（不变量 events[i].seq == eventSeqBase + i + 1），latestSeq 可直接作为下次 sinceSeq，eventsTruncated 表示还有更早的记录未随本次返回。读取走 (run_id, sequence) 的 keyset 分页，不使用 offset；升级前把事件放在 state_json 里的轮次在事件表中没有行，读取回退到内存窗口。
      parameters:
        - in: query
          name: fromStart
          description: true 时从 sinceSeq 之后的首条事件开始读取（sinceSeq=0 时从 seq=1 开始）；省略时 sinceSeq=0 仍返回默认尾部窗口。用于多端首次恢复完整历史，分页追平用 latestSeq 与 eventCount 判断。
          schema: { type: boolean, default: false }
        - in: query
          name: sinceSeq
          required: false
          description: 只返回该事件序号之后的事件（非负整数，单次最多 500 条）；追平或越界时返回空 events
          schema: { type: integer, minimum: 0 }
        - in: query
          name: eventLimit
          required: false
          description: 单次返回的事件条数上限，1–500，默认为尾部窗口大小
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: 信封 data.run（含 events 与 eventSeqBase / eventCount / latestSeq / eventsTruncated）
        "400":
          description: fromStart 不是布尔值，或 sinceSeq、eventLimit 不是整数或超出范围
        "404":
          description: 轮次不存在或不属于当前用户
  /agent/runs/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 从服务端父轮历史创建新轮次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudAgentRequest"
      responses:
        "200":
          description: 信封 data.run（新的 ID）
        "409":
          description: 父轮仍在执行、幂等键冲突，或画布已有另一轮 Agent 占用。旧父轮已有后续轮次时 reason 为 agent_conversation_stale_parent，客户端应同步最新历史，不能自动重发。原请求幂等回放优先于旧父轮检查。占用拒绝的 reason 为 canvas_agent_busy，details 包含 canvasId 和 agent（runId、status、cleanupPending），用于立即更新占用状态；不自动重试。
  /agent/runs/{id}/interjections:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 向正在运行的 Agent 轮次插入一句话
      description: 不新建轮次、不产生新的扣费身份。插话排进当前运行，在下一次模型调用前送达；同一 messageId 幂等。运行已结束返回 409（reason=agent_interjection_run_finished），客户端把这条留在本机队列作为下一轮发送。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text, messageId]
              properties:
                text:
                  type: string
                  maxLength: 4000
                messageId:
                  type: string
                  maxLength: 160
      responses:
        "200":
          description: 信封 data.accepted 与 data.pending
        "409":
          description: reason=agent_interjection_run_finished 表示本轮已结束，改为下一轮发送；reason=agent_run_state_busy 表示运行状态并发写入冲突，可用同一 messageId 重试
  /agent/runs/{id}/interjections/{messageId}:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          maxLength: 160
    delete:
      tags: [agent]
      summary: 撤回尚未送达模型的插话
      description: 只从待送队列移除并发出 user_interjection_withdrawn 事件；不停止本轮，也不取消已提交的生成任务。
      responses:
        "200":
          description: 信封 data.withdrawn
        "404":
          description: 插话不存在
        "409":
          description: reason=agent_interjection_already_delivered 表示已送达模型或本轮已结束，不能撤回；reason=agent_run_state_busy 表示并发写入冲突，可重试
  /agent/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 取消当前用户的 Agent 轮次
      description: 停止 Agent 后续步骤并取消尚未提交上游的任务；已提交上游（可能已计费）的媒体任务继续完成并回写画布，收尾在其结束后完成。
      responses:
        "200":
          description: 信封 data.accepted
  /agent/runs/{id}/undo:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    post:
      tags: [agent]
      summary: 撤销当前 Agent 运行产生的最新画布变更
      description: |
        仅撤销该运行最新一笔且当前完整画布哈希仍匹配的变更，不取消任务或退款。
        优先使用 canvas_updated.undo 中的原 runId/canvasId/stepId/expectedSnapshotHash；历史卡片不能改用最新运行ID。
        成功响应丢失可重放原请求，画布仍为撤销后快照时幂等确认；有后续新修改仍返回409。
        未保留完整快照、超过1MiB快照容量或已提交收费任务的变更不可撤销。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedSnapshotHash]
              properties:
                stepId:
                  type: string
                  maxLength: 160
                expectedSnapshotHash:
                  type: string
                  minLength: 64
                  maxLength: 64
                  pattern: "^[0-9a-fA-F]{64}$"
                reason:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: 信封 data.accepted 为 true 与当前 snapshotHash；相同原请求重试不会重复撤销
        "400":
          description: 请求无效、快照不可撤销或已提交任务不能撤销
        "409":
          description: 画布已发生后续变化，或 stepId 已不是该运行最新变更
  /agent/runs/{id}/approvals/{approvalId}/decision:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
      - name: approvalId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [agent]
      summary: 提交 Agent 工具审批决定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                reason:
                  type: string
                  maxLength: 2000
                mediaSettings:
                  type: object
                  additionalProperties: false
                  description: 仅 approve 图片生成审批可传；替换本次模型、画幅和质量，重新强校验，不修改提示词、引用或目标。logicalModelId 与 channelId + channelModelKey 二选一。
                  required: [size, quality]
                  properties:
                    logicalModelId:
                      type: string
                    channelId:
                      type: string
                    channelModelKey:
                      type: string
                    size:
                      type: string
                    quality:
                      type: string
      responses:
        "200":
          description: 信封 data.accepted
        "409":
          description: 审批不存在、已过期或决定冲突
  /agent/runs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/AgentRunID"
    get:
      tags: [agent]
      summary: Agent 运行事件回放与持续订阅
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: |
            首次及 revision 变化时发送紧凑 run_snapshot；无变化时 heartbeat；agent_event.seq 为递增游标，cleanupPending 期间持续发送。
            canvas_updated 的 payload 可含 AgentCanvasUpdatedPayload 中的 undo 凭据。仅无已提交收费任务且有完整快照的普通写入提供非空凭据；缺省或 null 不显示可执行撤销。
          content:
            text/event-stream:
              schema:
                type: string
  /openapi.yaml:
    get:
      tags: [meta]
      security: []
      summary: 本 OpenAPI 文档
      responses:
        "200":
          description: OpenAPI 3.0 YAML
          content:
            application/yaml:
              schema:
                type: string
  /admin/channels/{id}/duplicate:
    post:
      tags: [admin]
      summary: 复制系统渠道
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /admin/channels/{id}/models/batch-reprice:
    post:
      tags: [admin]
      summary: 批量保存系统渠道模型最终销售价
      description: |
        仅管理员可用。接收浏览器计算或手工修改后的最终售价及原始价格版本，不在服务端重算。
        前端按成本/(1−利润率)计算，支持0–6位积分小数四舍五入及重新计算。
        必须提交所选模型全部已启用规格，不改变成本、规格启停或模型启停。
        当前计费方式的价格字段必须完整且不能多余，价格为非负整数微积分，null无效。
        缺少成本/售价配置、重复或失效 ID、越权、超限价格、过期版本或并发版本冲突均整批拒绝。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [models]
              properties:
                models:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [modelId, priceVersion, priceTiers]
                    properties:
                      modelId: { type: string, minLength: 1 }
                      priceVersion: { type: integer, format: int64, minimum: 1 }
                      priceTiers:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          required: [id, priceVersion, prices]
                          properties:
                            id: { type: string, minLength: 1 }
                            priceVersion:
                              { type: integer, format: int64, minimum: 1 }
                            prices:
                              type: object
                              additionalProperties: false
                              description: 按次/秒仅unit字段；文本Token为输入、输出、缓存命中、缓存写入；视频Token仅输出。必须完整提交对应字段。
                              properties:
                                unitPriceMicrocredits:
                                  {
                                    type: integer,
                                    format: int64,
                                    minimum: 0,
                                    maximum: 9007199254740991,
                                  }
                                inputTokenPriceMicrocredits:
                                  {
                                    type: integer,
                                    format: int64,
                                    minimum: 0,
                                    maximum: 1000000000000,
                                  }
                                outputTokenPriceMicrocredits:
                                  {
                                    type: integer,
                                    format: int64,
                                    minimum: 0,
                                    maximum: 1000000000000,
                                  }
                                cachedTokenPriceMicrocredits:
                                  {
                                    type: integer,
                                    format: int64,
                                    minimum: 0,
                                    maximum: 1000000000000,
                                  }
                                cacheWriteTokenPriceMicrocredits:
                                  {
                                    type: integer,
                                    format: int64,
                                    minimum: 0,
                                    maximum: 1000000000000,
                                  }
            example:
              {
                models:
                  [
                    {
                      modelId: MODEL001,
                      priceVersion: 4,
                      priceTiers:
                        [
                          {
                            id: TIER001,
                            priceVersion: 8,
                            prices: { unitPriceMicrocredits: 1370000 },
                          },
                        ],
                    },
                  ],
              }
      responses:
        "200":
          description: 更新成功，data.updated 为更新的模型数量
