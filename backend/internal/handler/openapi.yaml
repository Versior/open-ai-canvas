      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/EcommerceAgentRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: data 含 pageCount、unitMicrocredits、totalMicrocredits、modelKey 和 channel,
          }
