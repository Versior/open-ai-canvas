  /admin/agent-pets:
    get:
      tags: [admin]
      summary: 列出形象库（内置和上传），含开放方式与拥有人数（购买或领取）
      responses:
        "200":
          description: 成功信封 data.pets
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  data:
                    type: object
                    properties:
                      pets: {type: array, items: {$ref: "#/components/schemas/AdminAgentPet"}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/agent-pets/import:
    post:
      tags: [admin]
      summary: 导入 Codex 宠物 ZIP（pet.json + 图集）或单张 WebP/PNG 图集，导入后默认未上架
      description: 文件最大 32 MiB、图集最大 16 MiB；图集须为带透明通道的 1536×1872（v1）或 1536×2288（v2）。pet.json 只读取名称和简介。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /admin/agent-pets/batch:
    post:
      tags: [admin]
      summary: 批量修改形象（上架、分类、角标、开放方式与价格、促销、排序位置），只改提供了的字段
      description: 一次最多 200 个。不适用的形象（如给非积分购买的形象开促销、打折后价格不变）跳过并在 skipped 说明；任一形象校验失败整批不保存。access 改成非 paid 时同时结束促销；promotion.enabled 为 false 时结束所选形象的促销，为 true 时按 percent（原价的百分比，0 为限时免费）定促销价，四舍五入到 0.01 积分。sortPosition 为 first / last 时把所选形象按原来的先后移到形象库最前或最后（间隔 10），其余形象的排序值不变；新排序值超出 -100000 到 100000 时整批拒绝。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, minItems: 1, maxItems: 200, items: {type: string}}
                enabled: {type: boolean}
                category: {type: string, maxLength: 12, description: 空字符串表示移出分类}
                badge: {type: string, maxLength: 6}
                access:
                  type: object
                  required: [mode]
                  properties:
                    mode: {type: string, enum: [free, vip, paid, spend]}
                    priceMicrocredits: {type: integer, format: int64}
                    unlockMicrocredits: {type: integer, format: int64}
                    groupCodes: {type: array, items: {type: string}}
                promotion:
                  type: object
                  required: [enabled]
                  properties:
                    enabled: {type: boolean}
                    label: {type: string, maxLength: 8}
                    percent: {type: integer, minimum: 0, maximum: 99}
                    startsAt: {type: string, format: date-time, nullable: true}
                    endsAt: {type: string, format: date-time, nullable: true}
                sortPosition: {type: string, enum: [first, last]}
      responses:
        "200":
          description: 成功信封 data 为批量结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  data: {$ref: "#/components/schemas/AdminAgentPetBatchResult"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/agent-pets/batch-delete:
    post:
      tags: [admin]
      summary: 批量删除上传的形象；内置形象和已有人拥有的形象跳过并说明原因
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, minItems: 1, maxItems: 200, items: {type: string}}
      responses:
        "200":
          description: 成功信封 data 为批量结果（deleted、skipped）
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  data: {$ref: "#/components/schemas/AdminAgentPetBatchResult"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/agent-pets/{id}:
    put:
      tags: [admin]
      summary: 保存形象的完整配置（名称、简介、上架、开放方式与价格、分组、分类、角标、促销、状态映射、说话风格、像素清晰、排序）
      description: access 为 free 时忽略价格和分组；vip 至少选一个分组且不能购买；paid 价格须大于 0，所选分组免费使用；spend 累计消费门槛须大于 0，达标后免费领取，所选分组免费使用。促销只对 paid 生效，促销价须低于原价（0 为限时免费），结束时间须晚于现在、开始时间，且一次不超过一年；未改动的促销原样保留。tone 与 lines 只对上传形象生效。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, enabled, access, priceMicrocredits, unlockMicrocredits, groupCodes, stateRows, pixelated, sortOrder]
              properties:
                name: {type: string, maxLength: 40}
                description: {type: string, maxLength: 200}
                enabled: {type: boolean}
                access: {type: string, enum: [free, vip, paid, spend]}
                priceMicrocredits: {type: integer, format: int64, description: paid 的价格}
                unlockMicrocredits: {type: integer, format: int64, description: spend 的累计消费门槛}
                groupCodes: {type: array, items: {type: string}}
                stateRows: {type: object, additionalProperties: {type: string}}
                pixelated: {type: boolean}
                sortOrder: {type: integer}
                category: {type: string, maxLength: 12}
                badge: {type: string, maxLength: 6}
                promoEnabled: {type: boolean}
                promoLabel: {type: string, maxLength: 8}
                promoPriceMicrocredits: {type: integer, format: int64, minimum: 0}
                promoStartsAt: {type: string, format: date-time, nullable: true}
                promoEndsAt: {type: string, format: date-time, nullable: true}
                tone: {type: string, enum: ["", gentle, kitty, puppy, robot, mystic, sunny], description: 仅上传形象}
                lines: {type: array, maxItems: 4, items: {type: string, maxLength: 40}, description: 仅上传形象}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [admin]
      summary: 删除上传的形象；内置形象只能下架，已有人购买或领取的形象返回 409
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
