  /model-catalog:
    get:
      tags: [models]
      summary: 获取创作端模型目录
      description: |
        固定 source=system，channels 直接来自系统渠道下的模型列表，models 为空数组；不反查逻辑模型。
        一级跨渠道按 displayName 分组，二级显示 channelLabel；模型请求仍使用 channelId + modelKey 定位。
        channelLabel 是后台渠道模型创建和更新时配置的渠道展示名，去除首尾空白后最多 80 字，空字符串表示使用所属渠道名称。
        description 是后台渠道模型创建和更新时填写的公开模型描述，去除首尾空白后最多 500 字；空字符串表示未填写。
        displayName 和 icon 用于一级模型菜单，channelLabel 不参与路由、权限或计费。
        渠道级 publicAlias 已废弃；成本配置和成本快照仅供管理端，不包含在本接口及用户报价中。
      responses:
        "200":
          description: 当前启用的模型目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    enum: [0]
                  msg:
                    type: string
                  data:
                    type: object
                    required: [source, models, channels]
                    properties:
                      source:
                        type: string
                        enum: [system]
                      models:
                        type: array
                        items:
                          type: object
                      channels:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            displayName:
                              type: string
                            models:
                              type: array
                              items:
                                type: object
                                properties:
                                  modelKey:
                                    type: string
                                  displayName:
                                    type: string
                                  icon:
                                    type: string
                                  channelLabel:
                                    type: string
                                    maxLength: 80
                                    default: ""
                                  textWire:
                                    type: string
                                    enum: [chat-completion, responses, claude-api]
                                    description: 仅文本模型。按协议插件的 create.path 识别的请求格式，浏览器据此选择系统代理路径；识别不出时省略。
                                  tags:
                                    type: array
                                    maxItems: 5
                                    description: 后台模型创建及更新使用同名字段；文字去除首尾空白且不能重复，空数组清除标签，仅用于展示。
                                    items:
                                      type: object
                                      required: [text, color]
                                      properties:
                                        text:
                                          type: string
                                          minLength: 1
                                          maxLength: 12
                                        color:
                                          type: string
                                          enum:
                                            [
                                              purple,
                                              blue,
                                              green,
                                              gold,
                                              orange,
                                              pink,
                                            ]
                                  description:
                                    type: string
                                    maxLength: 500
                                    default: ""
        "401":
          $ref: "#/components/responses/Error"
  /model-catalog/quote:
    post:
      tags: [models]
      summary: 按当前参数预估系统渠道模型费用
      description: |
        需要登录会话 Cookie。仅接受启用的系统渠道和模型，采用服务端能力默认值及价格档选择规则。
        不创建任务或账单、不冻结或扣除积分，也不调用模型供应商。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, modelKey, intent]
              properties:
                channelId:
                  type: string
                  minLength: 1
                modelKey:
                  type: string
                  minLength: 1
                  description: 系统渠道中配置的模型键
                intent:
                  $ref: "#/components/schemas/ModelRequestIntent"
      responses:
        "200":
          $ref: "#/components/responses/ModelQuote"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /models/{id}/quote:
    post:
      tags: [models]
      summary: 按当前参数预估前台模型费用
      description: |
        需要登录会话 Cookie。请求正文直接为创作意图，不使用 intent 外层包装。
        服务端按前台模型能力、默认参数、供应线路和价格策略报价，不创建任务、账单或积分冻结。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: 前台逻辑模型 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRequestIntent"
      responses:
        "200":
          $ref: "#/components/responses/ModelQuote"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /canvas-projects/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取当前用户画布内容和 revision
      responses:
        "200":
          description: 信封 data.project 包含完整画布及服务端 revision
        "304":
          description: If-None-Match 命中当前 revision，正文为空
        "404":
          description: 画布不存在或不属于当前用户
    delete:
      tags: [canvas]
      summary: 显式删除当前用户画布
      description: 删除后迟到的媒体回写和编辑操作不会重新创建画布；只有新的 create_canvas operation 可以显式创建同 ID 画布。
      responses:
        "200":
          description: 画布已删除，信封 data.id 返回画布 ID
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
  /canvas-projects/{id}/sync-status:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 读取当前用户画布版本、输入租约及 Agent 占用状态
      description: 需要登录并拥有画布。仅返回 revision、服务端时间、有效租约和 Agent 控制字段，不返回 token、完整画布或 Agent 对话正文；WebSocket 通知后校验状态，连接正常且无活动 Agent 时每三十秒补偿读取，断线或活动 Agent 期间恢复前台两秒、后台十五秒非重叠查询。版本变化后再读取正文。
      responses:
        "200":
          description: 信封 data 含 revision、serverTime、leases 和可空的 agent；每项租约含 nodeId、sessionId、expiresAt，agent 只含 runId、status、cleanupPending
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
  /canvas-projects/{id}/realtime:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [canvas]
      summary: 建立画布多窗口光标、拖拽预览与同步通知 WebSocket
      description: 使用登录 Cookie，校验画布归属和 Origin。welcome 返回 selfId/peers，每个 peer 包含服务端分配的 number（1–64），同一会话在各窗口编号一致且存续期间不变；Redis 模式跨实例分配并续期临时编号。客户端发送世界坐标 presence，服务端广播 peer/leave/invalidate/heartbeat。光标与拖拽预览不入库，invalidate 只在事务提交后发送，收到后通过 sync-status 校准。协议细节见画布操作同步专题。
      responses:
        "101":
          description: 已升级到 WebSocket
        "401":
          description: 未登录
        "403":
          description: 来源不允许
        "404":
          description: 画布不存在或不属于当前用户
        "503":
          description: 实时服务暂不可用，客户端保留 HTTP 同步
  /canvas-projects/{id}/edit-lease:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [canvas]
      summary: 获取、续期或释放节点文字编辑租约
      description: 需要登录并拥有画布。服务端有效期 30 秒，实际输入才获取；续期与释放必须携带当前 token。请求最大 2048 字节，每用户每分钟最多 240 次；过期持有者不能影响新持有者。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, nodeId, sessionId]
              properties:
                action:
                  type: string
                  enum: [acquire, renew, release]
                nodeId:
                  type: string
                  minLength: 1
                  maxLength: 160
                sessionId:
                  type: string
                  minLength: 1
                  maxLength: 160
                token:
                  type: string
                  maxLength: 80
      responses:
        "200":
          description: 信封 data 含 serverTime；获取及续期额外返回 lease 和 token，释放不返回 token
        "400":
          description: 参数无效
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户
        "409":
          description: reason 为 canvas_edit_lease_conflict；节点被其他窗口占用或证明已过期
        "429":
          description: 请求超过频率限制
  /canvas-projects/{id}/operations:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [canvas]
      summary: 按对象或字段变更写入画布
      description: |
        请求只提交对象级或字段级 operations，不提交整批画布快照。
        mutationId 是一次请求的幂等身份；响应丢失、断网、刷新或后台重试时必须复用同一个 mutationId 与原始 operations。
        更新、删除和连接操作要求目标存在并通过对象基线校验；同一字段冲突不会覆盖远端修改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mutationId, operations]
              properties:
                mutationId:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: 一次写入请求的幂等身份
                baseRevision:
                  type: integer
                  format: int64
                  minimum: 0
                  description: 生成 operations 时已确认的画布 revision，用于诊断和响应
                editProofs:
                  type: array
                  maxItems: 500
                  description: 本次修改涉及节点的编辑证明，节点不可重复；不计入 mutation 摘要，原请求 receipt 可在租约过期后重放
                  items:
                    type: object
                    required: [nodeId, sessionId, token]
                    properties:
                      nodeId: { type: string, minLength: 1, maxLength: 160 }
                      sessionId: { type: string, minLength: 1, maxLength: 160 }
                      token: { type: string, minLength: 1, maxLength: 80 }
                operations:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [type]
                    additionalProperties: true
                    description: create_canvas、create_node、patch_node、remove_node、create_connection、update_connection、remove_connection 或 set_field
      responses:
        "200":
          description: 信封 data.project 返回当前画布摘要，data.mutationId 返回原 mutationId
        "400":
          description: 请求、字段、对象基线或素材引用格式不合法
        "401":
          description: 未登录
        "404":
          description: 画布不存在或不属于当前用户，且请求未包含显式 create_canvas
        "409":
          description: 对象并发冲突、同一 mutationId 对应的请求摘要不同或编辑证明失效（reason 为 canvas_edit_lease_conflict）；原事务不会被覆盖
        "428":
          description: 缺少执行所需的对象基线
  /public/welcome:
    get:
      tags: [meta]
      security: []
      summary: 读取欢迎页开放状态
      responses:
        "200":
          description: 信封 data 仅包含 welcomeEnabled 布尔值，默认 true；Cache-Control 为 no-store
        "500":
          description: 配置读取失败
  /public/inspirations/feed:
    get:
      tags: [inspirations]
      security: []
      summary: 读取灵感上新条目（匿名可读）
      description: 后端定时从 YouMind、awesome-seedance 同步的中文条目，按首次收录时间倒序，最多 3000 条；进程内缓存 5 分钟。按 IP 每分钟 120 次。
      responses:
        "200": { description: "data={enabled,entries[{id,title,description,image,mode,prompt,category?,tags?,sourceId,credit?,sourceUrl?,addedAt,publishedAt?}],categories{来源:{分类码:名称}},syncedAt?}；enabled=false 时 entries 为空" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/settings/inspiration-feed:
    get:
      tags: [inspirations, admin]
      summary: 灵感上新状态（管理员）
      responses:
        "200": { description: "data.status={enabled,intervalHours,lastAttemptAt?,lastSuccessAt?,nextSyncAt?,lastError?,trigger?,sources[{sourceId,upstream,accepted,created,updated,error?}],total,bySource}" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    patch:
      tags: [inspirations, admin]
      summary: 开启或关闭灵感上新（管理员）
      description: 关闭后停止同步，公开接口不再返回已收录条目；写入管理员审计。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: data.status 为最新状态 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/settings/inspiration-feed/sync:
    post:
      tags: [inspirations, admin]
      summary: 立即同步灵感上新（管理员）
      description: 同步与请求解绑，最长约 8 分钟；部分来源失败仍返回 200，失败原因在 status.lastError 与 sources[].error。
      responses:
        "200": { description: data.status 为同步后的状态 }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: 上新已关闭，或另一实例/请求正在同步 }
        "502": { description: 全部来源都同步失败 }
  /agent/capabilities:
    get:
      tags: [agent]
