        [
          {
            in: path,
            name: projectId,
            required: true,
            schema: { type: string },
          },
        ]
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
  /task/{taskId}:
    get:
      tags: [ecommerce-agent]
