        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [defaultSurface, allowSurfaceSwitch, maxStylesPerRun, maxCountPerStyle]
              properties:
                defaultSurface: {type: string, enum: [quick, pro]}
                allowSurfaceSwitch: {type: boolean}
                defaultModel: {type: object}
                maxStylesPerRun: {type: integer, minimum: 1, maximum: 4}
                maxCountPerStyle: {type: integer, minimum: 1, maximum: 4}
      responses:
        "200": {description: data 为保存后的设置}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /libtv/gallery:
    get:
      tags: [libtv]
      summary: 读取 LibTV 公开作品列表
      description: 登录后匿名读取已审核的公开作品，不发送管理员 LibTV Token。total 不作为全库数量；后续分页保留首次返回的 requestId，按 hasMore 判断是否继续。不存储媒体原件，不创建生成任务。
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 1000, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 40, default: 20}}
        - {in: query, name: keyword, schema: {type: string, maxLength: 100}}
        - {in: query, name: tagId, schema: {type: integer, minimum: 0}}
        - {in: query, name: requestId, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: 标准信封 data 为 items、page、pageSize、hasMore、requestId；每项包含 templateUuid、projectUuid、title、description、coverUrl、mediaUrl、mediaType、authorName、authorAvatar、likeCount、publishedAt、tags、sourceUrl。
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /public/features:
    get:
      tags: [guest]
      summary: 游客读取功能开关
      description: 不需要登录。只返回各功能开关与 configured，不含操作人与更新时间。每个来源地址每分钟 60 次，全站游客每分钟 1200 次。
      responses:
        "200": {description: "标准信封 data.features；Cache-Control 为 private, no-store"}
        "429": {$ref: "#/components/responses/Error"}
  /public/model-catalog:
    get:
      tags: [guest]
      summary: 游客读取模型目录
      description: 不需要登录。按默认分组的渠道可见性与价格展示模型名称、图标、能力与价格档，不附加可用率统计，服务端缓存 60 秒。报价、可用性检查与任务创建仍要求登录。每个来源地址每分钟 30 次，全站游客每分钟 600 次。
      responses:
        "200": {description: "结构同 GET /model-catalog；Cache-Control 为 private, no-store"}
        "429": {$ref: "#/components/responses/Error"}
  /public/libtv/gallery:
    get:
      tags: [guest]
      summary: 游客读取 LibTV 公开作品列表
      description: 不需要登录，参数与返回同 GET /libtv/gallery。同一组参数（含 requestId）缓存 60 秒；首页不带 requestId 时游客共用缓存里的同一个 requestId，翻页保持同一顺序。每个来源地址每分钟 20 次，全站游客每分钟 200 次（与作品详情共用）。
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 1000, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 40, default: 20}}
        - {in: query, name: keyword, schema: {type: string, maxLength: 100}}
        - {in: query, name: tagId, schema: {type: integer, minimum: 0}}
        - {in: query, name: requestId, schema: {type: string, format: uuid}}
      responses:
        "200": {description: 结构同 GET /libtv/gallery}
        "400": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /public/libtv/works/{uuid}:
    get:
      tags: [guest]
      summary: 游客读取 LibTV 作品详情
      description: 不需要登录，返回同 GET /libtv/works/{uuid}，按作品缓存 60 秒；导入画布仍要求登录。
      parameters:
        - {in: path, name: uuid, required: true, schema: {type: string, pattern: '^[A-Fa-f0-9]{32}$'}}
      responses:
        "200": {description: "结构同 GET /libtv/works/{uuid}"}
        "400": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /libtv/works/{uuid}:
    get:
      tags: [libtv]
      summary: 读取 LibTV 已发布模板的制作步骤
      description: uuid 为公开 templateUuid，不是原项目 projectUuid。仅接受已审核的公开快照；steps 是快照节点顺序，不保证为执行顺序。模型名称仅为来源信息，不自动映射本站模型或发起收费生成。
      parameters:
        - {in: path, name: uuid, required: true, schema: {type: string, pattern: '^[A-Fa-f0-9]{32}$'}}
      responses:
        "200":
          description: 标准信封 data 为 work、steps、nodeCount、connectionCount、canImport、warnings。步骤包含 id、title、type、prompt、text、model、mediaUrls、aspectRatio、resolution、durationSeconds、referenceNodeIds。计数为来源总数，失效节点或连线通过 warnings 报告。
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /canvas-projects/{id}/import/libtv-template:
    post:
      tags: [libtv, canvas]
      summary: 预览并转换 LibTV 已发布模板
      description: 先校验目标画布属于当前用户，再读取公开 templateUuid；无需管理员 Token，不读取原项目私有详情。只返回转换后的节点、连线和报告，不写入画布。前端确认后通过现有画布保存合同持久化；媒体保留外链，不上传原件。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuid]
              properties:
                uuid: {type: string, pattern: '^[A-Fa-f0-9]{32}$'}
      responses:
        "200":
          description: '标准信封 data 与原 LibTV 导入结果一致，包含 batchId、batchCreatedAt、projectUuid、projectName、nodes、connections、计数及 skippedNodes、skippedConnections、warnings；节点增加可选 parentId、aspectRatio，来源 metadata 增加 templateUuid、snapshotId。媒体节点 results 为全部有效结果，项包含 sourceIndex（上游原数组零基索引）、content 及可选 naturalWidth、naturalHeight、durationMs、mimeType，顶层媒体为首个有效结果。multiResultNodeCount 统计有效结果超过一个的来源节点；importedNodeCount 不包含前端结果卡的展开数量。'
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /admin/ecommerce/skills/install:
    post:
      tags: [admin]
      summary: 安装或更新本站电商 Skill（管理员）
      description: ZIP或Markdown，最大1GiB，允许超过500MiB；同本地文件名覆盖更新，保留别名及开关。正文和引用合计32KB/12文件。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200": {description: 安装完成，默认启用}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/ecommerce/skills/install/github:
    post:
      tags: [admin]
      summary: 从GitHub安装电商Skill并跟随来源分支自动更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string}
                subdir: {type: string}
      responses:
        "200": {description: 安装完成，自动更新默认开启}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/ecommerce/skills/{id}/name:
    patch:
      tags: [admin]
      summary: 修改用户安装的电商Skill显示名称
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        "200": {description: 名称已保存，上游更新后保留}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /ecommerce/download:
    post:
      tags: [ecommerce-agent]
      summary: 通过浏览器原生下载流式导出当前用户的商品原图 ZIP
      description: 先校验全部资源归属与就绪状态，再发送附件响应并流式读取原件；不创建生成任务。最多500张、总计2GB。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [resourceId]
              properties:
                resourceId: {type: array, minItems: 1, maxItems: 500, items: {type: string}}
            encoding:
              resourceId: {style: form, explode: true}
      responses:
        "200": {description: 原始图片 ZIP 附件，application/zip}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /admin/ecommerce/categories:
    get:
      tags: [admin]
      summary: 按中英文路径浏览或搜索行业、品类和子品类及其有效创作方法
      parameters:
        - {in: query, name: parentId, schema: {type: string}, description: 留空浏览一级行业}
        - {in: query, name: q, schema: {type: string, maxLength: 128}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200": {description: data 含 nodes、lineage、total、page、limit 和 coverage；每个节点提供 methodScope、methodAncestorId 和有效 playbook，coverage 分别统计完整分类目录与方法覆盖}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /admin/ecommerce/skills:
    get:
      tags: [admin]
      summary: 管理员读取已安装电商技能、来源、固定版本和启停状态
      responses:
        "200":
          {
            description: data.skills 为技能列表，包含 id、name、enabled、instructions、contentHash、sourceUrl 和 sourceCommit,
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/ecommerce/skills/{id}:
    patch:
      tags: [admin]
      summary: 管理员启停指定电商技能，对新策划及关联知识检索生效
      parameters:
