        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /feedbacks/my:
    get:
      tags: [feedback]
      summary: 读取当前用户自己的反馈列表
      responses:
        "200":
          description: 成功信封，data 为按创建时间倒序排列的反馈数组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/UserFeedback" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /feedbacks/attachments:
    post:
      tags: [feedback]
      summary: 上传用户反馈图片或视频附件
      description: 单文件最大 50 MiB；整个 multipart 请求体最大 55 MiB。文件交由现有资源服务保存。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: 成功信封，data 为附件元数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/FeedbackAttachment" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/feedbacks:
    get:
      tags: [feedback, admin]
      summary: 管理员筛选和分页查询反馈
      parameters:
        - {
            in: query,
            name: type,
            schema:
              { type: string, enum: [all, bug, feature, improvement, other] },
          }
        - {
            in: query,
            name: status,
            schema:
              {
                type: string,
                enum: [all, pending, processing, resolved, closed, archived],
              },
          }
        - {
            in: query,
            name: keyword,
            schema: { type: string },
            description: 匹配标题、正文、用户名或联系方式,
          }
        - { in: query, name: archived, schema: { type: boolean } }
        - {
            in: query,
            name: page,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, default: 20 },
            description: 大于 100 时服务端使用默认值 20,
          }
      responses:
        "200":
          description: 成功信封，data 含 list、total、page、limit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/FeedbackListResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/feedbacks/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      tags: [feedback, admin]
      summary: 更新反馈状态、答复或归档标志
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackAdminUpdate" }
      responses:
        "200":
          description: 成功信封，data 为更新后的反馈
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/UserFeedback" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      tags: [feedback, admin]
      summary: 删除反馈记录
      responses:
        "200":
          description: 成功信封 data={ok:true}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok: { type: boolean, enum: [true] }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/feedbacks/{id}/archive:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [feedback, admin]
      summary: 归档反馈
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /admin/feedbacks/{id}/unarchive:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [feedback, admin]
      summary: 取消归档反馈
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /pose-library/poses:
    get:
      tags: [pose-library]
      summary: 按姿势分组浏览已启用且已同步的姿势
      parameters:
        - { in: query, name: keyword, schema: { type: string } }
        - { in: query, name: system, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: angle, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 60, default: 24 } }
      responses:
        "200": { description: "data 含 poses（每个姿势带 items 视角列表）、total、page、pageSize、facets（systems/categories/angles 计数）；不含来源署名" }
        "401": { $ref: "#/components/responses/Error" }
  /pose-library/items/{id}/thumb:
    get:
      tags: [pose-library]
      summary: 读取姿势缩略图（本站数据目录）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: v, schema: { type: integer }, description: 同步版本号，仅用于缓存失效 }
      responses:
        "200": { description: 图片字节，Cache-Control private max-age=604800 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /pose-library/items/{id}/image:
    get:
      tags: [pose-library]
      summary: 读取姿势原图（本站数据目录）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: v, schema: { type: integer } }
      responses:
        "200": { description: 图片字节 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /pose-library/use:
    post:
      tags: [pose-library]
      summary: 把选中的姿势原图复制成当前用户的资源
      description: 1–16 个条目，按普通上传计入用户每日上传额度与容量；同一用户同一张图重复选用复用已有资源。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 16, items: { type: string } }
      responses:
        "200": { description: "data.items 为 [{itemId,name,angle,category,resource}]，顺序与请求一致" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /admin/pose-library/items:
    get:
      tags: [pose-library, admin]
      summary: 姿势库条目、同步统计、来源与按体系汇总（管理员）
      parameters:
        - { in: query, name: keyword, schema: { type: string } }
        - { in: query, name: source, schema: { type: string } }
        - { in: query, name: system, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [pending, ready, failed] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: "data 含 items、total、page、pageSize、stats、sources、systems" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [pose-library, admin]
      summary: 上传一张自建姿势图（管理员）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                file: { type: string, format: binary, description: JPEG/PNG/WebP，最大 20 MiB }
                name: { type: string }
                system: { type: string }
                category: { type: string }
                angle: { type: string }
                code: { type: string, description: 编号相同的图合并为同一姿势的不同视角 }
      responses:
        "200": { description: data.item 为新条目 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/pose-library/import:
    post:
      tags: [pose-library, admin]
      summary: 导入 ai-pose-gallery-zh 的 pose-zh.json 或 yingce-pose-library 姿势包（管理员）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, systems]
              properties:
                file: { type: string, format: binary, description: JSON，最大 16 MiB }
                baseUrl: { type: string, description: 图片来源根地址，相对路径拼在其后 }
                systems: { type: string, description: JSON 字符串数组，只导入列出的体系 }
      responses:
        "200": { description: "data 含 source、format、total、created、updated、skipped、invalid、systems" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/pose-library/sync:
    post:
      tags: [pose-library, admin]
      summary: 下载一批待同步条目的图片到本站数据目录（管理员）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, minimum: 1, maximum: 40, default: 12 }
                retryFailed: { type: boolean, description: 先把失败条目放回待同步，只在一轮的第一批传入 }
      responses:
        "200": { description: "data 含 processed、succeeded、failed、failures、stats" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/pose-library/items/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      tags: [pose-library, admin]
      summary: 修改姿势条目（管理员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                system: { type: string }
                category: { type: string }
                angle: { type: string }
                code: { type: string }
                enabled: { type: boolean }
      responses:
        "200": { description: data.item 为更新后的条目 }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [pose-library, admin]
      summary: 删除姿势条目及其图片（管理员）
      responses:
        "200": { description: "data={ok:true}" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/pose-library/bulk:
    post:
      tags: [pose-library, admin]
      summary: 按条目或体系批量启用、停用、删除、重新同步（管理员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [enable, disable, delete, resync] }
                ids: { type: array, maxItems: 1000, items: { type: string } }
                sourceKey: { type: string }
                system: { type: string, description: 不传 ids 时必填 }
      responses:
        "200": { description: "data={affected}" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/settings/appearance/live2d:
    post:
      tags: [admin]
      summary: 导入管理员 Live2D 模型草稿（不自动启用）
      description: ZIP 最大 128 MiB，最多 256 条目；解压累计 384 MiB，单文件最大 128 MiB。只接受一个 Version 3 model3.json 及 ZIP 内 MOC3、PNG、JSON 引用。启用通过 PATCH /admin/settings/appearance 的 canvas 配置完成。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: 成功信封 data.model 包含 resourceId 和服务端确认的 entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, enum: [0] }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      model:
                        type: object
                        required: [resourceId, entry]
                        properties:
                          resourceId: { type: string }
                          entry: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /admin/settings/appearance/live2d/{id}/{file}:
    get:
      tags: [admin]
      summary: 读取模型草稿文件（管理员所有者或当前配置引用）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - {
            in: path,
            name: file,
            required: true,
            description: ZIP 内相对路径，可包含多级目录,
            schema: { type: string },
          }
      responses:
        "200": { description: JSON、PNG 或 MOC3 文件，非 JSON 信封 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /public/appearance/live2d/{id}/{file}:
    get:
      tags: [meta]
      security: []
      summary: 读取当前启用的 Live2D 模型文件
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - {
            in: path,
            name: file,
            required: true,
            description: ZIP 内相对路径，可包含多级目录,
            schema: { type: string },
          }
      responses:
        "200":
          {
            description: JSON、PNG 或 MOC3 文件，非 JSON 信封；停用后拒绝公开读取,
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/settings/appearance/avatar-bundles:
    post:
      tags: [admin]
      summary: 导入 Agent 状态动画 ZIP 草稿（不自动启用）
      description: ZIP 最大 128 MiB，解压累计最大 384 MiB、最多 128 个条目；根目录须包含 version 1 的 avatar.json 和其引用的 MP4。上传后需通过 PATCH /admin/settings/appearance 配置 avatarBundleResourceId 与 avatarClipStates 才会公开播放。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: 成功信封 data.bundle 包含 resourceId 和已校验 manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, enum: [0] }
                  msg: { type: string }
                  data:
                    type: object
                    properties:
                      bundle:
                        type: object
                        required: [resourceId, manifest]
                        properties:
                          resourceId: { type: string }
                          manifest:
                            type: object
                            required: [version, width, height, clips]
                            properties:
                              version: { type: integer, enum: [1] }
                              width:
                                { type: integer, minimum: 1, maximum: 4096 }
                              height:
                                { type: integer, minimum: 1, maximum: 4096 }
                              clips:
                                {
                                  type: object,
                                  additionalProperties: { type: string },
                                }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /admin/settings/appearance/avatar/{id}/{file}:
    get:
      tags: [admin]
      summary: 预览动画包文件（上传者或当前配置引用的管理员）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - {
            in: path,
            name: file,
            required: true,
            description: avatar.json 或 manifest 引用的 MP4 文件名,
            schema: { type: string },
          }
      responses:
        "200": { description: JSON 或 MP4 原始内容，支持 MP4 Range 请求 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /public/appearance/avatar/{id}/{file}:
    get:
      tags: [meta]
      security: []
      summary: 读取当前启用的 Agent 动画包文件
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - {
            in: path,
            name: file,
            required: true,
            description: avatar.json 或 manifest 引用的 MP4 文件名,
            schema: { type: string },
          }
      responses:
        "200":
          { description: JSON 或 MP4 原始内容，支持 Range；停用后拒绝公开读取 }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /agent-pets:
    get:
      tags: [agent]
      summary: 列出当前用户可见的智能体形象（已上架和已购买）及使用资格
      responses:
        "200":
          description: 成功信封 data 为形象列表；selectedPetId 为空表示使用站点默认形象
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  msg: {type: string}
                  data:
                    type: object
                    required: [pets, selectedPetId, creditsEnabled, consumedMicrocredits]
                    properties:
                      pets: {type: array, items: {$ref: "#/components/schemas/AgentPet"}}
                      selectedPetId: {type: string}
                      creditsEnabled: {type: boolean}
                      consumedMicrocredits: {type: integer, format: int64, description: 累计消费（已结算的模型调用积分），用于累计消费解锁}
        "401": {$ref: "#/components/responses/Error"}
  /agent-pets/selection:
    get:
      tags: [agent]
      summary: 读取当前使用的形象；未选择或已失去资格时 data.pet 为 null
      responses:
        "200":
          description: 成功信封 data.pet
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  data:
                    type: object
                    properties:
                      pet: {allOf: [{$ref: "#/components/schemas/AgentPet"}], nullable: true}
        "401": {$ref: "#/components/responses/Error"}
    put:
      tags: [agent]
      summary: 切换当前形象；petId 为空字符串时恢复站点默认形象
      description: 累计消费已达标（claimable）的形象在这里自动领取，之后调整门槛不影响已领取的用户。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [petId]
              properties:
                petId: {type: string}
      responses:
        "200": {$ref: "#/components/responses/Envelope"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /agent-pets/{id}/purchase:
    post:
      tags: [agent]
      summary: 用积分购买付费形象（幂等，已购买时不重复扣费）
      description: expectedPriceMicrocredits 必须等于当前价格，否则返回 409；余额不足返回 400，reason 为 failed_precondition。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedPriceMicrocredits]
              properties:
                expectedPriceMicrocredits: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: 成功信封 data 包含已购形象、本次是否扣费和购买后的可用积分
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: integer, enum: [0]}
                  data:
                    type: object
                    required: [pet, charged, availableMicrocredits]
                    properties:
                      pet: {$ref: "#/components/schemas/AgentPet"}
                      charged: {type: boolean}
                      availableMicrocredits: {type: integer, format: int64}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /agent-pets/{id}/spritesheet:
    get:
      tags: [agent]
      summary: 读取形象图集（WebP 或 PNG，8 列 × 9/11 行，单格 192×208）
      description: 已上架的形象所有登录用户可读；已下架的只有已拥有（购买或领取）的用户和管理员可读。v 等于当前 revision 时长期缓存，支持 If-None-Match。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: v, schema: {type: string}}
      responses:
        "200": {description: 图集原始内容}
        "304": {description: 未变化}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /agent-pets/{id}/preview:
    get:
