  /video-replication/teardowns:
    get:
      tags: [tasks]
      summary: 视频复刻页面的历史记录
      description: 需要登录，视频复刻关闭时返回 403。按创建时间倒序返回当前账号最近 50 次拆解（含排队、失败的任务）；已保存模型分析的记录带标题、模型和分析时间；有复刻方案的另带方案保存时间 planUpdatedAt 和按方案建过的画布数 canvasCount。
      responses:
        "200":
          description: data 为记录数组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/VideoReplicationRecord"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [tasks]
      summary: 视频复刻：异步拆解一条视频的镜头、关键帧和口播
      description: 需要登录，视频复刻关闭时返回 403。服务端用本地 ffmpeg 检测切点、截取每镜关键帧并拼成宫格，后台允许且配置了转写服务时识别口播，结果写入任务 resultJson。不调用模型、不计费，关键帧和宫格作为图片资源计入存储。只接受当前账号自己的、不超过后台时长上限（默认 3 分钟）的视频资源。相同用户使用相同幂等键和请求参数时返回原任务，参数不同返回 409。
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
          description: 客户端为一次拆解生成的稳定幂等键；重试原请求时必须复用
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoTeardownRequest"
      responses:
        "200":
          description: 已创建或复用异步拆解任务
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /video-replication/config:
    get:
      tags: [tasks]
      summary: 视频复刻页面用的限制
      description: 需要登录，视频复刻关闭时返回 403。返回后台设置的时长、镜头数上限，以及这台服务器现在能不能识别口播。
      responses:
        "200":
          description: data 为 VideoReplicationConfig
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/VideoReplicationConfig"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/video-replication/overview:
    get:
      tags: [admin]
      summary: 视频复刻使用统计
      description: 要求管理员。返回视频复刻设置、口播识别状态，拆解和链接导入任务按状态的数量、近 7 天与今天的数量、用过的人数，存过分析的拆解数，各平台的链接导入次数，近 14 个 UTC 自然日的每日数量，以及最近 8 次失败。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/video-replication/teardowns:
    get:
      tags: [admin]
      summary: 所有用户的视频复刻记录
      description: 要求管理员。按创建时间倒序分页返回拆解记录，带用户、口播来源和拆解提示；失败原因不做用户侧改写。
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: status, schema: {type: string, enum: [queued, running, succeeded, failed, cancelled]}}
        - {in: query, name: keyword, schema: {type: string, maxLength: 100}, description: 匹配用户名、昵称、邮箱，或完整的任务 ID}
      responses:
        "200":
          description: data 为分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [records, total, page, pageSize]
                        properties:
                          records: {type: array, items: {$ref: "#/components/schemas/AdminVideoReplicationRecord"}}
                          total: {type: integer}
                          page: {type: integer}
                          pageSize: {type: integer}
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /admin/video-replication/teardowns/{id}:
    get:
      tags: [admin]
      summary: 读取任意用户的一条视频复刻记录
      description: 要求管理员。返回拆解任务（resultJson 是镜头事实）、保存过的模型分析和记录的主人；不是拆解任务返回 404。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [admin]
      summary: 删除一条视频复刻记录
      description: |-
        要求管理员。只能删已结束（已完成、失败、已取消）的拆解，排队或拆解中返回 400。拆解任务、保存的模型分析和日志在一个事务里删掉，
        记管理审计 video_replication.teardown.delete；随后按资源删除的引用规则清理这条拆解存的关键帧和宫格：没被别处用到的删掉（各记一条 resource.delete 审计），
        被画布、其他任务等用到的保留，列在 keptResources 里。原视频是用户自己的素材，不删。图片清理失败时记录照样删除，imagesError 写原因。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200":
          description: data 为删除结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id, deletedResources, keptResources]
                        properties:
                          id: {type: string}
                          deletedResources: {type: array, items: {type: string}, description: 删掉的关键帧和宫格}
                          keptResources:
                            type: array
                            description: 仍被用到而保留的图片和用到它的地方
                            items:
                              type: object
                              required: [id, reason, references]
                              properties:
                                id: {type: string}
                                reason: {type: string}
                                references:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      kind: {type: string}
                                      id: {type: string}
                                      title: {type: string}
                          imagesError: {type: string, description: 图片清理失败的原因}
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /admin/video-replication/settings:
    get:
      tags: [admin]
      summary: 读取视频复刻设置
      description: 要求管理员。返回当前设置和口播识别状态，不做概览里的统计；视频复刻关着时也能读。
      responses:
        "200":
          description: data 为设置和口播识别状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/AdminVideoReplicationSettingsView"}
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    patch:
      tags: [admin]
      summary: 修改视频复刻设置
      description: 要求管理员。只改请求里给出的字段，保存后新的拆解任务和排队中的任务都按新设置执行。返回内容和 GET 相同：保存后的完整设置和按新设置算出的口播识别状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoReplicationSettingsPatch"
      responses:
        "200":
          description: data 为保存后的设置和口播识别状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/AdminVideoReplicationSettingsView"}
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /video-replication/teardowns/{id}:
    get:
      tags: [tasks]
      summary: 读取一条视频复刻记录
      description: 需要登录，视频复刻关闭时返回 403。返回拆解任务（resultJson 是镜头事实）和保存过的模型分析；不是本人的拆解任务返回 404。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200":
          description: data 为 VideoReplicationDetail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/VideoReplicationDetail"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /video-replication/teardowns/{id}/analysis:
    put:
      tags: [tasks]
      summary: 保存视频复刻的模型分析
      description: 需要登录。视频复刻关闭后也能保存，已经开始的分析照常落库。只接受本人已完成的拆解任务；rows 的数量和 shotNumber 必须与拆解结果的镜头一一对应。保存后覆盖这条记录之前的分析。正文不超过 512 KiB，计入账号结构化数据容量。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoReplicationAnalysis"
      responses:
        "200":
          description: data 为保存后的 VideoReplicationDetail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/VideoReplicationDetail"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
  /video-replication/teardowns/{id}/plan:
    put:
      tags: [tasks]
      summary: 保存视频复刻的复刻方案
      description: 需要登录，受视频复刻开关控制。只接受本人已完成的拆解任务；shots 的数量和 shotNumber 必须与拆解结果的镜头一一对应，treatment 只能是 remake、product、original、skip，至少保留一个镜头；original 需要 authorized 为 true；商品图最多 4 张，必须是本人已就绪的图片资源。整份覆盖之前的方案。正文不超过 256 KiB，计入账号结构化数据容量。
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoReplicationPlan"
      responses:
        "200":
          description: data 为保存后的 VideoReplicationDetail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/VideoReplicationDetail"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
  /tasks/{id}/recover-media:
    post:
      tags: [tasks]
      summary: 按原任务 ID 重试作品保存，不重新生成或创建计费订单
      description: 仅当前用户有恢复记录的保存失败任务可重入队；已在队列或运行中时幂等返回。每任务最多手动恢复三次，间隔至少一分钟。已取消、已退款或归属项目不可用时拒绝。
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /tasks/{id}/text-events:
    get:
      tags: [tasks]
      summary: 文本任务 SSE
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: after
          schema: { type: integer }
          description: 递增事件游标，不要用任务 ID
      responses:
        "200":
          description: text/event-stream
  /assets:
    get:
      tags: [assets]
      summary: 用户素材库
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /assets/batch-delete:
    post:
      tags: [assets]
      summary: 批量彻底删除当前用户素材
      description: 顶层 JSON 数组，一次请求、一个数据库事务。所有 ID 必须属于当前用户，不受任务、画布或历史引用阻塞；共享文件保留，其余通过 Outbox 异步清理，失败重试。任一素材不存在、越权或数据库写入失败时整批不删除。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 1000
              items:
                type: string
                minLength: 1
            example: ["asset-1", "asset-2"]
      responses:
        "200":
          description: 成功信封，data.ids 返回本次请求的素材 ID 数组；物理文件清理由后台执行。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ids]
                        properties:
                          ids:
                            type: array
                            items: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /assets/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    delete:
      tags: [assets]
      summary: 彻底删除当前用户素材
      description: 不依赖素材 archived 状态，也不受画布、任务、项目或历史快照引用阻塞；其他素材共享的物理对象仍保留。
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    AgentRunID:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: open_ai_canvas_session
  schemas:
    InteriorGenerateInput:
      type: object
      additionalProperties: false
      required: [surface, modeId, sourceResourceId, count]
      properties:
        surface: {type: string, enum: [quick, pro]}
        modeId: {type: string}
        roomKey: {type: string}
        styleKeys: {type: array, maxItems: 4, items: {type: string}}
        params: {type: object, additionalProperties: {type: string}}
        notes: {type: string, maxLength: 500}
        sourceResourceId: {type: string}
        referenceResourceIds: {type: array, maxItems: 3, items: {type: string}}
        count: {type: integer, minimum: 1, maximum: 4}
        size: {type: string, enum: [auto, "1:1", "3:2", "2:3", "4:3", "3:4", "16:9", "9:16", "21:9"]}
        quality: {type: string, enum: [auto, low, medium, high], description: 仅专业模式}
        model:
          type: object
          additionalProperties: false
          required: [model]
          properties:
            model: {type: string}
            channelId: {type: string}
            logicalModelId: {type: string}
            label: {type: string}
        projectId: {type: string, description: 关联本人的室内设计项目}
        roundId: {type: string, description: 页面用来回填结果的轮次标识}
    AgentPetPromotion:
      type: object
      required: [label, endsAt]
      properties:
        label: {type: string, maxLength: 8, description: 活动名称，默认“限时特惠”，促销价为 0 时默认“限时免费”}
        endsAt: {type: string, format: date-time, nullable: true, description: 为空表示管理员手动结束前一直有效}
    AgentPet:
      type: object
      required: [id, name, description, spriteVersion, revision, pixelated, stateRows, access, priceMicrocredits, listPriceMicrocredits, promotion, unlockMicrocredits, owned, memberFree, usable, purchasable, claimable, category, badge, tone, lines]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        spriteVersion: {type: integer, enum: [1, 2], description: 2 表示带 16 个视线方向，可跟随鼠标}
        revision: {type: string, description: 图集缓存版本}
        pixelated: {type: boolean}
        stateRows: {type: object, additionalProperties: {type: string, enum: [idle, running-right, running-left, waving, jumping, failed, waiting, running, review]}, description: 助手状态到图集动作的覆盖项}
        access: {type: string, enum: [free, vip, paid, spend]}
        priceMicrocredits: {type: integer, format: int64, description: 此刻的售价（促销中为促销价，限时免费为 0）；仅 paid 有值}
        listPriceMicrocredits: {type: integer, format: int64, description: 原价；仅 paid 有值}
        promotion: {allOf: [{$ref: "#/components/schemas/AgentPetPromotion"}], nullable: true, description: 只在促销进行中时返回}
        unlockMicrocredits: {type: integer, format: int64, description: 仅 spend 时大于 0，累计消费达到即可领取}
        category: {type: string, maxLength: 12, description: 商店分类，空为未分类}
        badge: {type: string, maxLength: 6, description: 卡片角标，如“新品”}
        owned: {type: boolean}
        memberFree: {type: boolean, description: 付费形象对当前用户分组免费}
        usable: {type: boolean}
        purchasable: {type: boolean}
        claimable: {type: boolean, description: 累计消费已达标、尚未领取；选择时自动领取}
        tone: {type: string, enum: ["", gentle, kitty, puppy, robot, mystic, sunny], description: 头顶气泡的说话风格；上传形象为空，前端用通用语气}
        lines: {type: array, maxItems: 4, items: {type: string, maxLength: 40}, description: 形象专属台词}
    AdminAgentPet:
      allOf:
        - $ref: "#/components/schemas/AgentPet"
        - type: object
          required: [source, enabled, groupCodes, sortOrder, ownerCount, revenueMicrocredits, promoEnabled, promoLabel, promoPriceMicrocredits, promoStartsAt, promoEndsAt, promoState]
          properties:
            source: {type: string, enum: [builtin, upload]}
            enabled: {type: boolean}
            groupCodes: {type: array, items: {type: string}}
            sortOrder: {type: integer}
            ownerCount: {type: integer, format: int64, description: 拥有人数（购买或领取）}
            revenueMicrocredits: {type: integer, format: int64, description: 累计购买收入}
            promoEnabled: {type: boolean}
            promoLabel: {type: string}
            promoPriceMicrocredits: {type: integer, format: int64}
            promoStartsAt: {type: string, format: date-time, nullable: true}
            promoEndsAt: {type: string, format: date-time, nullable: true}
            promoState: {type: string, enum: [none, scheduled, active, ended]}
            updatedAt: {type: string, format: date-time}
    AdminAgentPetBatchResult:
      type: object
      required: [pets, deleted, skipped]
      properties:
        pets: {type: array, items: {$ref: "#/components/schemas/AdminAgentPet"}, description: 修改后的形象}
        deleted: {type: array, items: {type: string}, description: 已删除的形象 ID}
        skipped:
          type: array
          items:
            type: object
            required: [id, name, reason]
            properties:
              id: {type: string}
              name: {type: string}
              reason: {type: string}
    VideoReplicationRecord:
      type: object
      required: [id, status, stage, progress, createdAt, durationMs, shotCount]
      properties:
        id: {type: string, description: 拆解任务 ID}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        stage: {type: string}
        progress: {type: integer}
        error: {type: string}
        createdAt: {type: string, format: date-time}
        durationMs: {type: integer}
        shotCount: {type: integer}
        coverResourceId: {type: string, description: 第一镜关键帧的图片资源 ID}
        previewResourceIds: {type: array, items: {type: string}, description: 均匀取自全片的最多 4 张关键帧图片资源 ID}
        width: {type: integer, description: 原视频宽度}
        height: {type: integer, description: 原视频高度}
        title: {type: string, description: 已保存分析的标题}
        model: {type: string, description: 已保存分析所用的模型}
        analyzedAt: {type: string, format: date-time}
        planUpdatedAt: {type: string, format: date-time, description: 复刻方案最后保存的时间}
        canvasCount: {type: integer, description: 按复刻方案建过几块画布}
    VideoReplicationDetail:
      type: object
      required: [task]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        analysis:
          $ref: "#/components/schemas/VideoReplicationAnalysis"
        analyzedAt: {type: string, format: date-time}
        plan:
          $ref: "#/components/schemas/VideoReplicationPlan"
        planUpdatedAt: {type: string, format: date-time}
    VideoReplicationPlan:
      type: object
      description: 复刻方案。服务端只校验版本、镜头、处理方式、授权和商品图归属，台词和提示词等字段由前端定义。
      required: [version, shots]
      additionalProperties: true
      properties:
        version: {type: integer, enum: [1]}
        authorized: {type: boolean, description: 用户确认是自己的视频或已获授权；为 false 时不能用 original}
        product:
          type: object
          additionalProperties: true
          properties:
            name: {type: string, maxLength: 60}
            sellingPoints: {type: string}
            audience: {type: string}
            look: {type: string}
            images:
              type: array
              maxItems: 4
              items:
                type: object
                required: [resourceId]
                additionalProperties: true
                properties:
                  resourceId: {type: string}
                  width: {type: integer}
                  height: {type: integer}
        scripts:
          type: array
          items: {type: object, additionalProperties: true}
        activeScriptId: {type: string}
        canvases:
          type: array
          maxItems: 20
          description: 按方案建过的画布，只用来在页面上列出和打开。
          items:
            type: object
            required: [id]
            additionalProperties: true
            properties:
              id: {type: string, maxLength: 64}
              title: {type: string}
              createdAt: {type: string}
              shots: {type: integer}
        shots:
          type: array
          items:
            type: object
            required: [shotNumber, treatment]
            additionalProperties: true
            properties:
              shotNumber: {type: integer, minimum: 1}
              treatment: {type: string, enum: [remake, product, original, skip]}
              dialogue: {type: string}
              onScreenText: {type: string}
              imagePrompt: {type: string}
              videoPrompt: {type: string}
    VideoReplicationAnalysis:
      type: object
      required: [version, model, rows]
      additionalProperties: true
      properties:
        version: {type: integer, enum: [1]}
        model: {type: string, maxLength: 200}
        title: {type: string, maxLength: 200}
        summary: {type: object, nullable: true, additionalProperties: true}
        rows:
          type: array
          items:
            type: object
            required: [shotNumber]
            additionalProperties: true
            properties:
              shotNumber: {type: integer, minimum: 1}
    VideoTeardownRequest:
      type: object
      required: [resourceId]
      additionalProperties: false
      properties:
        resourceId:
          type: string
          maxLength: 128
          description: 当前账号自己的视频资源 ID，时长不超过 3 分钟
        projectId:
          type: string
          description: 可选，当前账号的活动画布或项目 ID
        transcribe:
          type: boolean
          default: true
          description: 是否识别口播。服务端没有配置转写服务时任务照常完成，并在结果 warnings 里说明
        language:
          type: string
          maxLength: 16
          description: 口播语言提示，例如 zh、en；auto 或留空表示自动识别
        maxShots:
          type: integer
          minimum: 1
          maximum: 60
          description: 镜头数上限，超过时合并最短的镜头。不传时用后台设置的上限（默认 60），传了也不能超过它
    VideoReplicationSettings:
      type: object
      required: [maxDurationSeconds, maxShots, transcribeEnabled, transcriptionChannelModelId]
      properties:
        maxDurationSeconds: {type: integer, minimum: 10, maximum: 180, description: 能拆解的视频最长秒数，默认 180}
        maxShots: {type: integer, minimum: 1, maximum: 60, description: 一次拆解最多几个镜头，默认 60}
        transcribeEnabled: {type: boolean, description: 是否允许识别口播，默认 true；关闭后拆解不调用转写服务}
        transcriptionChannelModelId: {type: string, description: 后台选的转写模型（系统渠道里 OpenAI Audio 协议的音频模型，调 /audio/transcriptions，费用由平台承担）；空字符串表示用服务器自建的 whisper.cpp 服务}
    VideoReplicationSettingsPatch:
      type: object
      description: 没传的字段保持原值
      properties:
        maxDurationSeconds: {type: integer, minimum: 10, maximum: 180}
        maxShots: {type: integer, minimum: 1, maximum: 60}
        transcribeEnabled: {type: boolean}
        transcriptionChannelModelId: {type: string, description: 选转写模型；保存前校验模型和所在渠道都启用、是 OpenAI Audio 协议的音频模型，否则 400。传空字符串改回自建服务}
    VideoReplicationTranscription:
      type: object
      required: [enabled, featureEnabled, serviceConfigured, available]
      properties:
        enabled: {type: boolean, description: 后台是否允许识别口播}
        featureEnabled: {type: boolean, description: 「功能开放」里的字幕转写是否开放}
        serviceConfigured: {type: boolean, description: 有能用的转写方式：后台选的转写模型能用，或服务器配置了自建转写服务}
        available: {type: boolean, description: 三项都满足，拆解时会识别口播}
        engine: {type: string, enum: [channel, whisper], description: 实际会用的转写方式；channel 是后台选的转写模型，whisper 是服务器自建服务。都没有时不返回}
        model: {type: string, description: engine 为 channel 时的模型和渠道名称}
        modelIssue: {type: string, description: 后台选了转写模型但现在不能用时的原因（已删除、已停用、协议不对）}
        note: {type: string, description: 不能识别时的原因}
    AdminVideoReplicationSettingsView:
      type: object
      required: [settings, transcription]
      properties:
        settings: {$ref: "#/components/schemas/VideoReplicationSettings"}
        transcription: {$ref: "#/components/schemas/VideoReplicationTranscription"}
    VideoReplicationConfig:
      type: object
      required: [maxDurationSeconds, maxShots, transcribeAvailable]
      properties:
        maxDurationSeconds: {type: integer}
        maxShots: {type: integer}
        transcribeAvailable: {type: boolean, description: 后台允许口播识别、字幕转写已开放且服务器配置了转写服务}
        transcribeNote: {type: string, description: 不能识别口播时的原因}
    AdminVideoReplicationRecord:
      allOf:
        - $ref: "#/components/schemas/VideoReplicationRecord"
        - type: object
          required: [user]
          properties:
            user:
              type: object
              required: [id]
              properties:
                id: {type: string}
                username: {type: string}
                displayName: {type: string}
            projectId: {type: string}
            transcript: {type: string, enum: [asr, none], description: 口播来源，任务没完成时省略}
            warnings: {type: array, items: {type: string}}
            completedAt: {type: string, format: date-time}
    SocialVideoParseHeader:
      type: object
      required: [name, value]
      properties:
        name: { type: string, maxLength: 64 }
        value: { type: string, maxLength: 1024, description: "可以用 {url}、{platform}、{key} 变量" }
    SocialVideoParseAPIRequest:
      type: object
      required: [name, platforms, url]
      properties:
        name: { type: string, maxLength: 60 }
        category: { type: string, maxLength: 60, description: 独立于视频平台的管理分类 }
        platforms:
          type: array
          minItems: 1
          items: { type: string, enum: [douyin, tiktok, kuaishou, xiaohongshu, bilibili, weibo, youtube, instagram, facebook, twitter, vimeo, pinterest, threads, xigua, weishi, haokan, wechat, zhihu, snackvideo, cocofun, pipigx, zuiyou] }
        enabled: { type: boolean }
        priority: { type: integer, minimum: 0, maximum: 9999, description: 优先级策略下数字越小越先用 }
        weight: { type: integer, minimum: 1, maximum: 100, description: 按权重随机策略下的权重 }
        method: { type: string, enum: [GET, POST] }
        url: { type: string, maxLength: 2048, description: "接口地址模板，用 {url} 放视频链接（自动 URL 编码），{key} 放密钥，{platform} 放平台" }
        bodyType: { type: string, enum: [none, json, form] }
        body: { type: string, maxLength: 8192, description: POST 请求体模板，JSON 里变量写在字符串中 }
        headers:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/SocialVideoParseHeader" }
        secret: { type: string, description: 只写不读；留空表示不修改 }
        clearSecret: { type: boolean }
        timeoutSeconds: { type: integer, minimum: 3, maximum: 60 }
        mapping:
          type: object
          properties:
            successPath: { type: string, description: 判断成功的字段路径，如 code }
            successValues: { type: string, description: 逗号分隔的成功取值，默认 200,0,true,success,ok }
            videoUrlPath: { type: string, description: 视频地址字段路径，如 data.url；留空自动识别 }
            titlePath: { type: string }
            coverPath: { type: string }
            idPath: { type: string }
            durationPath: { type: string }
            durationUnit: { type: string, enum: [s, ms] }
            messagePath: { type: string, description: 失败时的错误信息字段 }
        downloadHeaders:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/SocialVideoParseHeader" }
        remark: { type: string, maxLength: 200 }
    SocialVideoParseSettings:
      type: object
      properties:
        strategy: { type: string, enum: [priority, round_robin, weighted, fastest] }
        maxAttempts: { type: integer, minimum: 1, maximum: 10, description: 一次导入最多依次尝试几个接口 }
        failureThreshold: { type: integer, minimum: 1, maximum: 20, description: 连续失败几次自动停用 }
        autoRecover: { type: boolean }
        recoverAfterMinutes: { type: integer, minimum: 5, maximum: 1440 }
        healthCheckMinutes: { type: integer, minimum: 0, maximum: 1440, description: 0 表示不定期巡检，否则最少 10 分钟 }
        sampleLinks:
          type: object
          additionalProperties: { type: string }
          description: 各平台用于测试、巡检和自动恢复的视频链接
    SocialVideoParseSourceRequest:
      type: object
      required: [name, url]
      properties:
        name: { type: string, maxLength: 60 }
        url: { type: string, maxLength: 2048, description: 返回导出格式或接口数组 JSON 的地址，最大 1 MiB }
        enabled: { type: boolean }
        intervalHours: { type: integer, minimum: 1, maximum: 168 }
        autoEnable: { type: boolean, description: 新采集的接口测试通过后自动启用 }
    SocialVideoParseTestRequest:
      type: object
      properties:
        id: { type: string, description: 已保存接口的 ID；只传 id 时测试已保存的定义并计入运行状态 }
        api: { $ref: "#/components/schemas/SocialVideoParseAPIRequest" }
        url: { type: string, description: 测试链接；留空用设置里这个平台的测试链接 }
        platform: { type: string }
    SocialVideoImportRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 4096
          description: 受支持平台（见 GET /social-video/platforms）的单视频 URL，也可以是只包含一个视频 URL 的分享文本
        projectId:
          type: string
          description: 可选；关联的当前用户活动项目 ID
        maxDurationSeconds:
          type: integer
          minimum: 1
          maximum: 180
          description: 可选；这次导入能接受的最长秒数，不传按 180。解析接口给了时长时下载前就拦下，没给时下载后校验，超长的视频不存成资源。同一幂等键换了这个值算不同的请求
    Task:
      type: object
      required: [id, type, status, stage, progress, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        type: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled, text_replay] }
        stage: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        provider: { type: string }
        model: { type: string }
        billing:
          type: object
          description: 列表和单任务详情共用账务摘要；冻结不是扣费，仅 settled 返回 chargedMicrocredits
          properties:
            status: { type: string, enum: [reserved, running, settled, refunded, uncertain] }
            amountMicrocredits: { type: integer, format: int64 }
            reservedMicrocredits: { type: integer, format: int64 }
            chargedMicrocredits: { type: integer, format: int64 }
            refundedMicrocredits: { type: integer, format: int64 }
        resultJson:
          type: string
          description: 成功时为 JSON 字符串；社交视频导入包含 platform、canonicalId、title、resourceId、width、height、durationMs、mimeType、size
        error: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EcommerceSetting:
      type: object
      required: [enabled, modelLibraryEnabled, autoBindEnabled, flows, models, templates, revision]
      properties:
        enabled: {type: boolean}
        modelLibraryEnabled: {type: boolean}
        autoBindEnabled: {type: boolean}
        revision: {type: string, description: 读取时的版本，新配置为 initial}
        capabilities:
          type: object
          additionalProperties: false
          required: [planning, suite-forge, model-cast, pattern, listing, print-pack, pipeline, layers]
          properties:
            planning: {$ref: "#/components/schemas/EcommerceFlowSetting"}
            suite-forge: {$ref: "#/components/schemas/EcommerceFlowSetting"}
            model-cast: {$ref: "#/components/schemas/EcommerceFlowSetting"}
            pattern: {$ref: "#/components/schemas/EcommerceFlowSetting"}
            listing: {$ref: "#/components/schemas/EcommerceFlowSetting"}
            print-pack: {$ref: "#/components/schemas/EcommerceFlowSetting"}
            pipeline: {$ref: "#/components/schemas/EcommerceFlowSetting"}
            layers: {$ref: "#/components/schemas/EcommerceFlowSetting"}
        templates:
          type: array
          maxItems: 200
          description: 整份配置请求体最多 2 MiB；公共接口只返回已发布且用途启用的模板
          items: {$ref: "#/components/schemas/EcommerceSuiteTemplate"}
        flows:
          type: object
          required: [detail, main, wear, seed]
          additionalProperties: false
          properties:
            detail: {$ref: "#/components/schemas/EcommerceFlowSetting"}
            main: {$ref: "#/components/schemas/EcommerceFlowSetting"}
            wear: {$ref: "#/components/schemas/EcommerceFlowSetting"}
            seed: {$ref: "#/components/schemas/EcommerceFlowSetting"}
        models:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, name, enabled, tags, resourceIds]
            properties:
              id: {type: string, maxLength: 100}
              name: {type: string, maxLength: 100}
              enabled: {type: boolean, description: 启用须至少一张图片}
              tags: {type: array, maxItems: 20, items: {type: string, maxLength: 50}}
              resourceIds: {type: array, maxItems: 12, uniqueItems: true, items: {type: string, maxLength: 100}}
    EcommerceSuiteTemplate:
      type: object
      required: [id, name, flow, category, enabled, style, source, shots]
      properties:
        id: {type: string, minLength: 1, maxLength: 150}
        name: {type: string, minLength: 1, maxLength: 100}
        flow: {type: string, enum: [detail, main, wear, seed]}
        category: {type: string, maxLength: 200}
        enabled: {type: boolean}
        style: {type: string, maxLength: 6000}
        source: {type: string, maxLength: 500}
        shots:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required: [title, duty]
            properties:
              title: {type: string, minLength: 1, maxLength: 100}
              duty: {type: string, minLength: 1, maxLength: 12000}
    EcommerceFlowSetting:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
        directorPrompt: {type: string, maxLength: 20000, description: 仅管理员接口读写；公共接口省略。空串使用服务端内置指令}
    EcommerceAgentRequest:
      type: object
      required: [fileInfoList, platform]
      description: 商品分析、预检、策划和出图共用请求；生成时还须传 generateType 与 imageCount。模型由后台配置选择。
      properties:
        fileInfoList:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required: [url]
            properties:
              url: {type: string, minLength: 1, maxLength: 2048, description: 当前用户已上传素材的文件地址或 HTTPS 商品图地址}
        query: {type: string, maxLength: 4000}
        platform: {type: string, description: 受支持的平台名称或知识库平台标识}
        language: {type: string}
        panelType: {type: string}
        generateType: {type: integer, enum: [100, 101, 102, 103, 200, 400]}
        imageCount: {type: integer, minimum: 1, maximum: 15, description: 生成类型 200 要求至少 5 页}
        aspectRatio: {type: string}
        selectedRecommendationId: {type: string}
        modelKey: {type: string}
        channel: {type: string, enum: ["", promotion, premium]}
        needText: {type: boolean, nullable: true}
        userSellingPoints: {type: string, maxLength: 2000}
        brand:
          type: object
          properties:
            brandName: {type: string}
            styleDesc: {type: string}
            themeColors: {type: string}
        projectId: {type: string}
        idempotencyKey: {type: string, maxLength: 150}
    ThinkingRequest:
      type: string
      enum: ["", auto, deep, off, minimal, low, medium, high, max]
      description: 空串或省略等同 auto（模型默认）；deep 取模型支持的最高非 max 档位。具体档位按实际渠道模型的思考能力归一，不改变计价。
    CanvasTextOptions:
      type: object
      properties:
        stream:
          type: boolean
        thinkingLevel:
          $ref: "#/components/schemas/ThinkingRequest"
    CreateTaskRequest:
      type: object
      required: [type]
      properties:
        projectId: { type: string }
        type: { type: string }
        operation: { type: string }
        prompt: { type: string }
        provider: { type: string }
        model: { type: string }
        logicalModelId: { type: string }
        input:
          type: object
          description: 按任务模式传入参数；模型、渠道、协议与计价由服务端重新校验。电商文本阶段的思考意图由后台阶段配置覆盖。
          properties:
            mode: { type: string }
            textOptions:
              $ref: "#/components/schemas/CanvasTextOptions"
          additionalProperties: true
    FeedbackAttachment:
      type: object
      required: [id, name, type, url, size, mimeType]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [image, video] }
        url: { type: string }
        size: { type: integer, format: int64, minimum: 0 }
        mimeType: { type: string }
    UserFeedback:
      type: object
      required:
        [
          id,
          userId,
          userName,
          userEmail,
          contact,
          type,
          title,
          content,
          attachments,
          environment,
          status,
          adminReply,
          archived,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        userId: { type: string }
        userName: { type: string }
        userEmail: { type: string }
        contact: { type: string }
        type: { type: string, enum: [bug, feature, improvement, other] }
        title: { type: string, description: 最多 200 个 UTF-8 字节 }
        content: { type: string, description: 最多 10000 个 UTF-8 字节 }
        attachments:
          {
            type: string,
            description: JSON-encoded array of FeedbackAttachment,
          }
        environment:
          { type: string, description: JSON-encoded client environment object }
        status:
          {
            type: string,
            enum: [pending, processing, resolved, closed, archived],
          }
        adminReply: { type: string }
        repliedAt: { type: string, format: date-time, nullable: true }
        archived: { type: boolean }
        archivedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FeedbackSubmission:
      type: object
      required: [title, content]
      properties:
        type: { type: string, enum: [bug, feature, improvement, other] }
        title:
          { type: string, minLength: 1, description: 最多 200 个 UTF-8 字节 }
        content:
          { type: string, minLength: 1, description: 最多 10000 个 UTF-8 字节 }
        contact: { type: string }
        attachments:
          {
            type: string,
            description: JSON-encoded array of FeedbackAttachment,
          }
        environment:
          { type: string, description: JSON-encoded client environment object }
    FeedbackAdminUpdate:
      type: object
      properties:
        status: { type: string, enum: [pending, processing, resolved, closed] }
        adminReply: { type: string }
        archived: { type: boolean }
    FeedbackListResult:
      type: object
      required: [list, total, page, limit]
      properties:
        list:
          { type: array, items: { $ref: "#/components/schemas/UserFeedback" } }
        total: { type: integer, format: int64 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }

    LoginLog:
      type: object
      properties:
        id: { type: string }
        userId: { type: string, nullable: true }
        username: { type: string, description: 事件时用户名快照 }
        displayName: { type: string }
        account: { type: string, description: 用户名或脱敏的尝试账号 }
        event: { type: string, enum: [login, logout] }
        method:
          {
            type: string,
            enum: [password, email, sms, linuxdo, verification, unknown],
          }
        source: { type: string, enum: [login, registration, logout] }
        result: { type: string, enum: [success, failed] }
        ip: { type: string }
        userAgent:
          {
            type: string,
            maxLength: 512,
            description: 客户端自报信息，不作为身份判断依据,
          }
        sessionRef:
          {
            type: string,
            description: 会话 ID 的单向哈希，仅关联历史事件，不含 Token,
          }
        reason: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    ToolMutation:
      type: object
      required: [type, label, prompt]
      properties:
        type: { type: string, enum: [style, motion, nine_grid, effect] }
        label: { type: string, description: 名称最多 120 字节 }
        prompt:
          { type: string, description: 最多 8000 字节，不允许嵌套工具标签 }
        visibility: { type: string, enum: [private, public], default: private }
        desc: { type: string }
        tag: { type: string }
        cover:
          { type: string, description: 本人已上传完成的资源 URL，仅限私有工具 }
        mediaUrl:
          { type: string, description: 本人已上传完成的资源 URL，仅限私有工具 }
        extraInfo: { type: array, items: { type: string } }
        ratio: { type: string }
    ModelRequestIntent:
      type: object
      required: [capability]
      properties:
        capability:
          type: string
          enum: [text, image, video, audio]
        operation:
          type: string
          description: 可选生成操作，必须符合所选模型的能力合同
        inputs:
          type: object
          description: 按素材类型统计的参考数量，如 image、video、audio；另受所选模型的数量上限约束
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 128
        options:
          type: object
          description: 当前创作规格；未指定的参数使用服务端默认值
          additionalProperties: true
          example:
            vquality: 720p
            size: "16:9"
            videoSeconds: 5
            videoGenerateAudio: true
        referenceVideoDurationsMs:
          type: array
          description: 仅报价使用；按顺序给出参考视频时长（毫秒），长度必须等于 inputs.video。省略时按 15 秒上限预估。真实任务不读取该字段，按秒计费的参考视频时长由后端实测
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 3600000
    LogicalModelQuote:
      type: object
      required:
        [logicalModelId, billingMode, quantity, amountMicrocredits, estimated]
      properties:
        logicalModelId:
          type: string
          description: 前台逻辑模型 ID；直接查询系统渠道模型时为空字符串
        billingMode:
          type: string
          enum: [fixed_request, per_second, token]
        quantity:
          type: integer
          format: int64
          minimum: 1
          description: 按次为 1，按秒为生成秒数，按 Token 为预留用量（视频含平台预留余量）
        amountMicrocredits:
          type: integer
          format: int64
          minimum: 0
          description: 预估预留微积分，1000000 微积分等于 1 积分；明确配置的免费价格返回 0
        estimated:
          type: boolean
          description: Token 计费为 true；优先有效上游 usage，视频无有效用量时按提交的公式快照结算，预留不构成费用上限
        videoTokenEstimate:
          $ref: "#/components/schemas/VideoTokenEstimate"
        referenceVideo:
          $ref: "#/components/schemas/QuoteReferenceVideo"
    QuoteReferenceVideo:
      type: object
      description: 仅按秒或视频 Token 计费的视频请求挂参考视频时返回（按次计费不返回），用于展示“生成 N 秒 + 参考视频 M 秒”的报价构成
      required:
        [count, billed, generatedSeconds, referenceSeconds, billedSeconds, estimated]
      properties:
        count: { type: integer, minimum: 1 }
        billed:
          type: boolean
          description: true 表示模型开启参考视频计费，本次按带参考视频价格计入参考视频；false 表示参考视频不计费
        generatedSeconds: { type: integer, format: int64, minimum: 0 }
        referenceSeconds:
          type: number
          description: 参考视频总秒数；计费时为计入的秒数，不计费时为已知时长（未知为 0）
        billedSeconds:
          type: integer
          format: int64
          minimum: 0
          description: 按秒计费时计入数量的参考视频秒数（向上取整）；Token 计费为 0
        estimated:
          type: boolean
          description: 参考视频时长未知，按 15 秒上限预估
    VideoTokenEstimate:
      type: object
      description: 仅视频 Token 报价返回；将火山公式用量和平台预留余量分开披露
      required:
        [
          formulaTokens,
          reservedTokens,
          outputWidth,
          outputHeight,
          framesPerSecond,
          outputSeconds,
          referenceSeconds,
          referenceDurationEstimated,
          dimensionsEstimated,
          reservationMarginPercent,
        ]
      properties:
        formulaTokens:
          type: integer
          format: int64
          minimum: 1
          description: 按（参考视频总秒数 + 输出秒数）× 输出宽 × 输出高 × 帧率 / 1024 向上取整；上游最低计费用量可能更高
        reservedTokens:
          type: integer
          format: int64
          minimum: 1
          description: 公式用量叠加平台预留余量后向上取整
        outputWidth:
          type: integer
          format: int64
          minimum: 1
        outputHeight:
          type: integer
          format: int64
          minimum: 1
        framesPerSecond:
          type: integer
          format: int64
          minimum: 1
        outputSeconds:
          type: integer
          format: int64
          minimum: 1
        referenceSeconds:
          type: number
          format: double
          minimum: 0
          description: 计入公式的参考视频总秒数；报价仅有参考数量时采用预估时长
        referenceDurationEstimated:
          type: boolean
          description: 参考时长未知、使用预估值时为 true
        dimensionsEstimated:
          type: boolean
          description: 自适应画幅或上游型号无法确定，使用预估像素尺寸时为 true
        reservationMarginPercent:
          type: integer
          format: int64
          minimum: 0
          description: 平台预留余量百分比，不属于火山官方计费公式
    ModelQuoteEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [data]
          properties:
            code:
              type: integer
              enum: [0]
            data:
              type: object
              required: [quote]
              properties:
                quote:
                  $ref: "#/components/schemas/LogicalModelQuote"
    AgentMemoryStep:
      type: object
      required: [tool, action]
      properties:
        tool: { type: string }
        action: { type: string }
        note: { type: string }
    AgentMemoryEvidence:
      type: object
      required: [sequence, tool]
      properties:
        sequence: { type: integer, minimum: 0 }
        callId: { type: string }
        tool: { type: string }
    AgentMemory:
      type: object
      description: 用户私有记忆；来源事件只说明产生依据，不证明经验已验证有效；计数不是效果评分
      required:
        [
          id,
          topic,
          category,
          situation,
          status,
          hits,
          injected,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        topic: { type: string }
        category: { type: string }
        situation: { type: string }
        lesson: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/AgentMemoryStep" }
        source: { type: string }
        originRunId: { type: string }
        evidence:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/AgentMemoryEvidence" }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        hits:
          {
            type: integer,
            format: int64,
            minimum: 0,
            description: 主动查阅次数，不等同成功次数,
          }
        injected:
          {
            type: integer,
            format: int64,
            minimum: 0,
            description: 含该条目的模型任务实际入队次数,
          }
        lastVerifiedAt:
          {
            type: string,
            format: date-time,
            description: 原始验证时间；新建、去重、压缩及批准不刷新,
          }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentMemoryCompactSummary:
      type: object
      required: [rewritten, merged, removed, skipped]
      properties:
        rewritten: { type: integer, minimum: 0 }
        merged: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
    AgentMemoryCompactView:
      type: object
      required: [compactInterval, lastStatus]
      properties:
        compactInterval: { type: string, enum: [off, daily, weekly, monthly] }
        logicalModelId: { type: string }
        channelId: { type: string }
        channelModelKey: { type: string }
        model: { type: string }
        taskId: { type: string }
        proposalId: { type: string }
        lastCompactAt: { type: string, format: date-time }
        lastStatus:
          type: string
          enum:
            [
              idle,
              queued,
              running,
              awaiting_review,
              applied,
              rejected,
              restored,
              succeeded,
              failed,
            ]
          description: awaiting_review只表示提案生成；applied表示本人批准后已应用；succeeded表示本批无可应用修改
        lastError: { type: string }
        summary: { $ref: "#/components/schemas/AgentMemoryCompactSummary" }
    AgentMemoryChange:
      type: object
      required: [kind, before, after]
      properties:
        kind: { type: string, enum: [rewrite, merge] }
        before:
          type: array
          minItems: 1
          maxItems: 80
          items: { $ref: "#/components/schemas/AgentMemory" }
        after: { $ref: "#/components/schemas/AgentMemory" }
    AgentMemoryProposal:
      type: object
      required: [id, status, version, summary, changes, createdAt]
      properties:
        id: { type: string }
        status:
          {
            type: string,
            enum: [generating, pending, approved, rejected, no_changes, failed],
          }
        version: { type: integer, format: int64, minimum: 1 }
        taskId: { type: string }
        summary: { $ref: "#/components/schemas/AgentMemoryCompactSummary" }
        changes:
          type: array
          maxItems: 80
          items: { $ref: "#/components/schemas/AgentMemoryChange" }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
    AgentMemoryProposalDecision:
      type: object
      additionalProperties: false
      required: [decision, version]
      properties:
        decision: { type: string, enum: [approve, reject] }
        version:
          {
            type: integer,
            format: int64,
            minimum: 1,
            description: 列表中读到的提案版本,
          }
    AgentMemoryRevision:
      type: object
      required: [id, proposalId, version, before, after, createdAt]
      properties:
        id: { type: string }
        proposalId: { type: string }
        version: { type: integer, format: int64, minimum: 1 }
        before:
          type: array
          maxItems: 80
          items: { $ref: "#/components/schemas/AgentMemory" }
        after:
          type: array
          maxItems: 80
          items: { $ref: "#/components/schemas/AgentMemory" }
        createdAt: { type: string, format: date-time }
        restoredAt: { type: string, format: date-time }
    AgentMemoryRevisionRestore:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          {
            type: integer,
            format: int64,
            minimum: 1,
            description: 列表中读到的恢复版本；当前内容也必须匹配应用后快照,
          }
    AgentCanvasUndoReceipt:
      type: object
      required: [runId, canvasId, stepId, expectedSnapshotHash]
      properties:
        runId: { type: string, description: 产生本次画布变更的原运行ID }
        canvasId: { type: string, description: 产生本次变更的画布 }
        stepId: { type: string }
        expectedSnapshotHash:
          {
            type: string,
            minLength: 64,
            maxLength: 64,
            pattern: "^[0-9a-fA-F]{64}$",
          }
    AgentCanvasUpdatedPayload:
      type: object
      required: [canvasId, operation, callId]
      properties:
        canvasId: { type: string }
        operation: { type: string }
        callId: { type: string }
        requiresRefresh: { type: boolean }
        canvasPatch: { type: object, additionalProperties: true }
        actions:
          { type: array, items: { type: object, additionalProperties: true } }
        undo:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentCanvasUndoReceipt"
          description: 仅有完整快照的未提交收费普通写入携带；不能替代服务端最新变更和完整哈希校验
    AgentProfileRequest:
      type: object
      additionalProperties: false
      required: [scope, content, revision]
      properties:
        scope:
          type: string
          enum: [user, project, canvas]
        projectId:
          type: string
        canvasId:
          type: string
        content:
          type: string
          description: 常驻偏好文档，最多 12000 个 Unicode 字符；不能授权节点、工具、预算或绕过审批
        revision:
          type: integer
          minimum: 0
          description: 待更新层的数字 revision；首次创建为 0
    CloudAgentRequest:
      type: object
      additionalProperties: false
      required: [prompt, permissionMode, contextScope, budget, idempotencyKey]
      properties:
        canvasId:
          type: string
          maxLength: 80
          description: 可选。为空时是平台级对话：不占画布锁、只开放无画布工具，contextScope 和 focusNodeIds 必须为空。续轮可换绑画布，服务端会注入换绑说明。
        prompt:
          type: string
          description: 非空，最多 16000 字节
        logicalModelId:
          type: string
        model:
          type: string
        channelId:
          type: string
        channelModelKey:
          type: string
        permissionMode:
          type: string
          enum: [read_only, request_approval, auto]
        reasoningMode:
          type: string
          enum: [off, auto, deep, minimal, low, medium, high, max]
          description: 本轮思考意图或明确档位；auto 沿用模型默认，deep 取最高非极限档，max 明确选择极限；按实际渠道模型能力归一
        profileRevision:
          type: string
          description: GET /agent/profile 的生效合并 revision；变化时拒绝创建新轮次
        pinnedSkillIds:
          type: array
          maxItems: 16
          items:
            type: string
          description: 用户为对话固定或在本条消息里点名的技能；其余已安装且 agentMode=auto 的技能由 Agent 按技能目录自动发现
        contextScope:
          type: array
          maxItems: 1
          description: canvas 需要 canvasId；studio 需要 studioProductId，且 canvasId 与焦点节点必须为空。
          items:
            type: string
            enum: [canvas, studio]
        studioProductId:
          type: string
          maxLength: 80
          description: 只与 contextScope=[studio] 一起出现，绑定当前用户的电商生图台商品；建 run 时校验归属，本轮只开放生图台工具与通用工具。
        focusNodeIds:
          type: array
          maxItems: 8
          items:
            type: string
          description: 当前焦点节点；前端多选超过 8 个时传前 8 个，剩余数见 focusNodeOmittedCount
        focusNodeOmittedCount:
          type: integer
          minimum: 0
          maximum: 10000
          description: 前端实际选中但未附带的焦点节点数，仅用于提示模型，不授予访问权限
        budget:
          type: object
          additionalProperties: false
          required: [maxCredits]
          properties:
            maxCredits:
              type: number
              minimum: 0
              exclusiveMinimum: true
              maximum: 1000000
            maxGenerationTasks:
              type: integer
              minimum: 0
              description: 本轮累计生成任务数上限；0表示不设此项业务上限，仍受积分预算约束
            maxVideoSeconds:
              type: integer
              minimum: 0
              description: 本轮累计视频秒数上限；0表示不设此项业务上限，仍受模型能力和积分预算约束
            maxSteps:
              type: integer
              minimum: 0
              description: 本轮模型调用步数；0表示不设固定步数限制，正数有效上限夹至9999，Go与Pi共用该值
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
    Envelope:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 0 成功；失败时默认等于 HTTP 状态，或 status*100+n 的细分码
        data: {}
        msg:
          type: string
        reason:
          type: string
          description: 仅失败时出现。稳定机器可读原因。
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            code:
              type: integer
              enum:
                [
                  400,
                  401,
                  403,
                  404,
                  409,
                  413,
                  429,
                  500,
                  502,
                  503,
                  504,
                  40301,
                  40302,
                  40901,
                  42901,
                ]
            data:
              nullable: true
            reason:
              type: string
              enum:
                - invalid_argument
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - project_name_conflict
                - skill_version_conflict
                - failed_precondition
                - quota_exceeded
                - storage_capacity_exceeded
                - storage_read_only
                - rate_limited
                - unavailable
                - timeout
                - internal
                - bad_gateway
                - upstream_dns_failed
                - model_capability_not_supported
                - model_price_not_configured
                - model_route_unavailable
                - provider_request_failed
                - model_catalog_mismatch
                - invalid_model_selection
  responses:
    ModelQuote:
      description: 当前参数对应的费用报价，位于信封 data.quote
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ModelQuoteEnvelope"
    Envelope:
      description: 业务成功信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    Error:
      description: 业务失败信封
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
