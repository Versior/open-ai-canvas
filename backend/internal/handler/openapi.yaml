  /agent/recommend:
    post:
      tags: [ecommerce-agent]
      summary: 根据商品与平台重新推荐方向
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/EcommerceAgentRequest" },
                },
            },
        }
      responses:
        "200": { description: data 含 4 至 6 个推荐方向 }
  /agent/projects/{projectId}/task:
    get:
      tags: [ecommerce-agent]
