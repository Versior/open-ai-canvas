name: Stage deploy images

# Build images for the feat/ecommerce-canvas deployment.
# Differences from upstream publish-images.yml:
#   1. Skips Quality checks (upstream internal/app has a flaky test that randomly fails).
#   2. Adds COPY CONTRIBUTORS.md before the web build (root Dockerfile omits it,
#      while web/src/pages/welcome/contributors.ts imports it via ?raw).
# Images are compiled ONLY on GitHub Actions runners and pushed to GHCR.

on:
  workflow_dispatch:
  push:
    branches:
      - ci/stage-deploy
    paths:
      - ".ci/build-trigger"

permissions:
  contents: read
  packages: write

concurrency:
  group: stage-deploy-images
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve build inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      build_time: ${{ steps.info.outputs.build_time }}
      owner: ${{ steps.info.outputs.owner }}
      short: ${{ steps.info.outputs.short }}
    steps:
      - uses: actions/checkout@v4
      - id: info
        name: Read VERSION and commit metadata
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_time=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: [prepare]
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: open-ai-canvas-web
            dockerfile: Dockerfile
            arch: multi
            platforms: linux/amd64,linux/arm64
            runner: ubuntu-24.04
          - image: open-ai-canvas-backend
            dockerfile: backend/Dockerfile
            arch: amd64
            platforms: linux/amd64
            runner: ubuntu-24.04
          - image: open-ai-canvas-backend
            dockerfile: backend/Dockerfile
            arch: arm64
            platforms: linux/arm64
            runner: ubuntu-24.04-arm
          - image: open-ai-canvas-yingce-agent
            dockerfile: yingce-agent/Dockerfile
            arch: multi
            platforms: linux/amd64,linux/arm64
            runner: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch web Dockerfile to ship CONTRIBUTORS.md
        if: matrix.image == 'open-ai-canvas-web'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          path = "Dockerfile"
          text = open(path, encoding="utf-8").read()
          anchor = "COPY README.md /app/README.md\n"
          added = "COPY CONTRIBUTORS.md /app/CONTRIBUTORS.md\n"
          if added in text:
              print("CONTRIBUTORS.md already copied, skipping")
          elif anchor not in text:
              sys.exit("anchor missing: root Dockerfile structure changed")
          else:
              open(path, "w", encoding="utf-8").write(text.replace(anchor, anchor + added, 1))
              print("added COPY CONTRIBUTORS.md")
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable commit image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ needs.prepare.outputs.build_time }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid image digest" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish ${{ matrix.image }} manifest
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [open-ai-canvas-web, open-ai-canvas-backend, open-ai-canvas-yingce-agent]
    concurrency:
      group: stage-image-tags-${{ matrix.image }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified digests
        shell: bash
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}
          MAIN_SHA: ${{ github.sha }}
          SHORT: ${{ needs.prepare.outputs.short }}
          DIGEST_DIR: ${{ runner.temp }}/digests
          EXPECTED: ${{ matrix.image == 'open-ai-canvas-backend' && '2' || '1' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$DIGEST_DIR"/*)
          [[ ${#files[@]} -eq $EXPECTED ]] || { echo "digest count mismatch: expected $EXPECTED got ${#files[@]}" >&2; exit 1; }
          sources=()
          for file in "${files[@]}"; do
            digest="${file##*/}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid digest: $digest" >&2; exit 1; }
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$MAIN_SHA" \
            --tag "$IMAGE:sha-$SHORT" \
            --tag "$IMAGE:stage-deploy" \
            "${sources[@]}"
          echo "published $IMAGE:stage-deploy <- $MAIN_SHA"
